<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4f6b">
<title>Visite terrain Gemba · Outils qualité</title>
<meta name="description" content="Outil de visite terrain (Gemba walk) qualité et sûreté, atelier et bureau : grille d'observation, photos, synthèse, compte rendu Word ou PDF et pilotage des visites. Pensé pour le téléphone, hors ligne, données locales.">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="../site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Outils qualité">
<script>
  /* Thème partagé avec le site (clé 'theme'), appliqué avant le rendu pour éviter le flash */
  (function () {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script>
  /* Langue partagée avec le site (clé 'lang', ou ?lang=en dans l'adresse) ; anglais si le navigateur n'est pas en français */
  (function () {
    var q = /[?&]lang=(fr|en)\b/.exec(location.search), s = null;
    try { if (q) localStorage.setItem('lang', q[1]); s = localStorage.getItem('lang'); } catch (e) { /* stockage bloqué */ }
    var l = s === 'fr' || s === 'en' ? s : q ? q[1] : (/^fr\b/i.test(navigator.language || 'fr') ? 'fr' : 'en');
    window.LANG = l;
    document.documentElement.lang = l;
    if (l === 'en') {
      document.documentElement.classList.add('i18n-wait');
      var st = document.createElement('style'); st.textContent = '.i18n-wait body{visibility:hidden}'; document.head.appendChild(st);
    }
  })();
</script>
<!--
  Visite terrain (Gemba) qualité et sûreté nucléaire, atelier et bureau.
  Fichier unique, sans dépendance. Les données restent sur l'appareil (stockage local du navigateur,
  photos dans IndexedDB) ; le transfert entre appareils se fait par export et import JSON.
  Le suivi des écarts et des actions reste dans Fabasoft : l'outil prépare, relève et rédige.

  Organisation du code :
    1. Constantes et référentiel par défaut
    2. Utilitaires, stockage, photos, modèle
    3. Visite : nouvelle visite, informations, grille, synthèse, compte rendu
    4. Vues transverses : visites, pilotage, référentiel, paramètres
    5. Exports : Word, Excel, PDF par impression, JSON, message court ; lecture Excel et CSV
    6. Événements et démarrage
-->
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f8f9fa; --border:#d9dde3; --border2:#c3c9d1;
  --text:#1f2933; --muted:#5f6b7a; --accent:#2f4f6b; --accent2:#3f6a8f; --accent-text:#ffffff;
  --hover:#eceff3; --danger:#a23434; --warn:#8a5d0f; --ok:#2e6b3a; --bar:#3f6a8f;
  --r-C:#2e6b3a; --r-BP:#2f5d86; --r-AM:#8a5d0f; --r-E:#a23434; --r-NA:#6b7682; --on:#ffffff;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1e2226; --panel2:#24292e; --border:#343a41; --border2:#454c55;
  --text:#e3e6ea; --muted:#9aa4b0; --accent:#7fa6c6; --accent2:#9dbad3; --accent-text:#11161b;
  --hover:#2a3036; --danger:#e07a7a; --warn:#d9a845; --ok:#7cc08a; --bar:#7fa6c6;
  --r-C:#7cc08a; --r-BP:#8fb3d4; --r-AM:#d9a845; --r-E:#e07a7a; --r-NA:#8a939e; --on:#11161b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Structure : téléphone d'abord (barre du haut, contenu, navigation en bas) */
.app{display:grid;grid-template-rows:calc(52px + var(--safe-t)) 1fr auto;grid-template-columns:1fr;height:100vh;height:100dvh}
.appbar{grid-row:1;display:flex;align-items:center;gap:10px;padding:var(--safe-t) 12px 0;background:var(--panel);border-bottom:1px solid var(--border);min-width:0}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand span{display:none;font-weight:400;color:var(--muted);margin-left:6px}
.hdr-ctx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13.5px}
.hdr-ctx b{color:var(--text)}
.spacer{flex:1}
main{grid-row:2;position:relative;overflow:hidden;min-width:0;min-height:0;display:grid;grid-template-rows:1fr auto}
.view{grid-row:1;min-height:0}
.vtabs{grid-row:2}
.view{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 28px}
.nav{grid-row:3;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.nav button{all:unset;text-align:center;padding:10px 2px 11px;font-size:13.5px;color:var(--muted);cursor:pointer;border-top:2px solid transparent}
.nav button.active{color:var(--text);font-weight:700;border-top-color:var(--accent)}
.nav .nav-foot{display:none}
.vtabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.vtabs button{all:unset;text-align:center;padding:10px 2px 11px;font-size:13.5px;color:var(--muted);cursor:pointer;border-top:2px solid transparent;position:relative}
.vtabs button.active{color:var(--text);font-weight:700;border-top-color:var(--accent)}
.vtabs .dot{display:inline-block;min-width:17px;padding:0 4px;border-radius:9px;font-size:11px;line-height:17px;font-weight:700;background:var(--r-E);color:var(--on);margin-left:4px}
body.in-visit .nav{display:none}
body:not(.in-visit) .vtabs{display:none}
.appbar .back{display:none}
body.has-back .appbar .back{display:inline-flex}
body.in-visit .brand{display:none}
.site-back{color:var(--muted);text-decoration:none;white-space:nowrap;padding:4px 12px 4px 0;border-right:1px solid var(--border);font-size:13px}
.site-back:hover{color:var(--accent)}
.site-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
body.has-back .site-back{display:none}

@media (min-width:900px){
  body.has-back .site-back{display:inline}
  body{font-size:14px}
  .app{grid-template-rows:52px 1fr;grid-template-columns:200px 1fr}
  .appbar{grid-column:1/-1;padding:0 16px}
  .brand span{display:inline}
  body.in-visit .brand{display:block}
  .hdr-ctx{border-left:1px solid var(--border);padding-left:14px}
  .nav{grid-row:2;grid-column:1;display:flex!important;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--border);padding:12px 8px}
  .nav button{text-align:left;padding:9px 12px;border-radius:6px;border-top:0;color:var(--text);font-size:14px}
  .nav button:hover{background:var(--hover)}
  .nav button.active{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
  .nav .nav-foot{display:block;margin-top:auto;padding:8px 10px;font-size:12px;color:var(--muted);line-height:1.4}
  main{grid-row:2;grid-column:2;grid-template-rows:auto 1fr}
  body.in-visit .view{grid-row:2}
  body:not(.in-visit) main{grid-template-rows:1fr}
  .vtabs{grid-row:1;display:flex;gap:2px;border-top:0;border-bottom:1px solid var(--border);padding:0 14px}
  .vtabs button{padding:12px 14px;border-top:0;border-bottom:2px solid transparent;flex:0 0 auto}
  .vtabs button.active{border-bottom-color:var(--accent)}
  .view{padding:20px 26px 40px}
  body.has-back .appbar .back{display:none}
}
.wrap{max-width:860px;margin:0 auto}
.wrap.wide{max-width:1180px}

/* Titres et textes */
h2{font-size:19px;margin:0 0 4px}
h3{font-size:15.5px;margin:22px 0 8px}
h4{font-size:14px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 10px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border:1px solid var(--border2);background:var(--panel);border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.3;text-align:center}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--danger)}
.btn.danger-bg{background:var(--danger);border-color:var(--danger);color:var(--on)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
.btn.big{min-height:52px;font-size:16px;width:100%}
.btn.wide{width:100%}
.lnk{all:unset;color:var(--accent2);cursor:pointer;font-size:13px;padding:4px 0}
:root[data-theme="dark"] .lnk{color:var(--accent)}
.lnk:hover{text-decoration:underline}
input[type=text],input[type=email],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--panel);outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:64px;line-height:1.4}
@media (min-width:900px){input[type=text],input[type=email],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{font-size:14px;min-height:36px;padding:6px 9px}}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:600px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:6px 0}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--border2);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;text-align:center;padding:10px 6px;cursor:pointer;border-left:1px solid var(--border2);font-size:14px;line-height:1.25}
.seg button:first-child{border-left:0}
.seg button small{display:block;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.seg button.on small{color:inherit;opacity:.85}
.seg.sm button{padding:7px 4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--border2);border-radius:18px;cursor:pointer;background:var(--panel);font-size:14px}
.chip:has(input:checked){background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:var(--accent)}
.chip input{margin:0;accent-color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin:0 0 14px}
.box h3:first-child{margin-top:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border2);border-radius:8px}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:3px;background:var(--hover);color:var(--muted);border:1px solid var(--border);white-space:nowrap;line-height:18px}
.tag.sur{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--border));background:color-mix(in srgb,var(--danger) 8%,var(--panel))}
.badge{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--border2));color:var(--c,var(--muted));white-space:nowrap;line-height:19px}
.badge.fill{background:var(--c);color:var(--on)}
.c-C{--c:var(--r-C)} .c-BP{--c:var(--r-BP)} .c-AM{--c:var(--r-AM)} .c-E{--c:var(--r-E)} .c-NA{--c:var(--r-NA)}
.alert{border-left:4px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--panel));padding:8px 10px;border-radius:0 6px 6px 0;margin:8px 0;font-size:13.5px}
.alert.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.alert.info{border-left-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--panel))}

/* Liste des visites */
.vcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin:0 0 8px;cursor:pointer}
.vcard:hover{border-color:var(--border2)}
.vcard .sel{grid-row:1/span 3;display:flex;align-items:flex-start;padding-top:2px}
.vcard .l1,.vcard .l2,.vcard .l3{grid-column:2;min-width:0}
.vcard .sel input{width:20px;height:20px;accent-color:var(--accent)}
.vcard .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vcard .l1 b{font-size:15.5px}
.vcard .l2,.vcard .l3{font-size:13.5px;color:var(--muted)}
.vcard .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.selbar{position:sticky;top:-14px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.filters input[type=search]{flex:1 1 200px}
.filters select{width:auto;flex:0 1 auto}
.pfilters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pfilters select{width:100%}
@media (min-width:700px){.pfilters{display:flex}.pfilters select{width:auto}}

/* Grille de visite */
.prog{position:sticky;top:-14px;z-index:6;background:var(--bg);padding:10px 0 10px;margin:-4px 0 6px}
@media (min-width:900px){.prog{top:-20px}}
.prog-bar{height:8px;background:var(--hover);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog-txt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:6px 0 8px;flex-wrap:wrap}
.prog-txt b{color:var(--text)}
.prog-act{display:grid;grid-template-columns:1fr auto;gap:8px}
.th{margin:0 0 12px}
.th-head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:10px 4px 8px;cursor:pointer;border-bottom:2px solid var(--border2);margin-bottom:8px}
.th-head span:first-child{flex:1;font-weight:700;font-size:15px}
.th-head .th-cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.th-head .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}
.th.closed .chev{transform:rotate(-45deg);margin-top:0}
.th.closed .th-body{display:none}
.it{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:8px;padding:10px 12px 12px;margin:0 0 9px;scroll-margin-top:150px}
.it.r-C{border-left-color:var(--r-C)} .it.r-BP{border-left-color:var(--r-BP)} .it.r-AM{border-left-color:var(--r-AM)} .it.r-E{border-left-color:var(--r-E)} .it.r-NA{border-left-color:var(--r-NA);opacity:.85}
.it.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.it-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.it-id{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.it-top .spacer{flex:1}
.it-txt{font-weight:600;font-size:15.5px;line-height:1.35;margin:0 0 6px}
.it-hint{font-size:13.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin:0 0 8px}
.it-hint p{margin:0 0 4px}
.it-hint p:last-child{margin:0}
.it-hint b{color:var(--text);font-weight:600}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rb{all:unset;box-sizing:border-box;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 2px;font-size:12.5px;line-height:1.15;font-weight:600;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--border));color:var(--c);border-radius:7px;cursor:pointer;background:var(--panel);hyphens:manual;overflow-wrap:anywhere}
.rb:active{transform:scale(.97)}
.rb.on{background:var(--c);border-color:var(--c);color:var(--on)}
@media (min-width:600px){.rb{font-size:13.5px}}
.it-det{margin-top:10px}
.it-det .fld{margin-bottom:9px}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;border:1px solid var(--border2);background:var(--panel2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{all:unset;position:absolute;right:2px;top:2px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1;padding:4px 6px;border-radius:4px;cursor:pointer}
.viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px}

/* Synthèse, pilotage */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
.kpi{grid-column:span 2;min-width:0}
.kpi:nth-child(-n+2){grid-column:span 3}
@media (min-width:700px){.kpis{grid-template-columns:repeat(5,1fr)}.kpi,.kpi:nth-child(-n+2){grid-column:auto}}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);font-size:14px}
table.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2);padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--hover)}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.barcell{display:flex;align-items:center;gap:8px;min-width:120px}
.barcell .track{flex:1;height:10px;background:var(--hover);border-radius:0 4px 4px 0;position:relative}
.barcell .track i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0}
.barcell .val{width:42px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.late{color:var(--danger);font-weight:600}
.thlist{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px 12px}
.thr{padding:9px 0;border-bottom:1px solid var(--border)}
.thr:last-child{border-bottom:0}
@media (min-width:900px){.thlist.cols2{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.thlist.cols2 .thr:nth-last-child(2):nth-child(odd){border-bottom:0}}
.thr-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.thr-h span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.thr-c{font-size:12.5px;color:var(--muted);margin-top:3px}
.thr-c b{font-weight:600}
.thr-c .e{color:var(--r-E)} .thr-c .am{color:var(--r-AM)}
.thr-h span.late{color:var(--danger)}
.list{margin:0;padding:0;list-style:none}
.list li{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin:0 0 7px;cursor:pointer}
.list li .t{font-weight:600}
.list li .c{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
@media (max-width:640px){
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards{border:0;background:transparent}
  table.cards thead{display:none}
  table.cards tr{background:var(--panel);border:1px solid var(--border);border-radius:7px;margin:0 0 7px;padding:6px 4px}
  table.cards td{border:0;padding:3px 8px}
  table.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
  table.cards td.num{text-align:left}
}
.checks li{cursor:pointer}
.report{background:#fff;color:#1f2933;border:1px solid var(--border);border-radius:6px;padding:18px 16px;font-family:Calibri,Arial,sans-serif;font-size:14px}
.report h1{font-size:20px;margin:0 0 2px;color:#2f3e4d}
.report h2{font-size:16px;color:#2f3e4d;margin:18px 0 6px;border-bottom:1px solid #c3c9d1;padding-bottom:3px}
.report table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 8px}
.report th{background:#e4e8ec;text-align:left;padding:4px 6px;border:1px solid #a0a7b0}
.report td{padding:4px 6px;border:1px solid #a0a7b0;vertical-align:top;white-space:pre-wrap}
.report .org{color:#5f6b7a;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.report img{max-width:100%;max-height:260px}
@media (max-width:600px){
  .report{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:14px 12px}
  .report table{font-size:12px}
  .report th,.report td{padding:3px 5px}
}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
@media (min-width:700px){.exports{grid-template-columns:repeat(5,1fr)}}
.exports .btn:last-child:nth-child(odd){grid-column:span 2}
@media (min-width:700px){.exports .btn:last-child:nth-child(odd){grid-column:auto}}
.exports .btn{flex-direction:column;gap:0;min-height:56px;white-space:normal}
.exports .btn small{font-size:11.5px;color:var(--muted);font-weight:400}
.exports .btn.primary small{color:inherit;opacity:.85}

/* Référentiel et paramètres */
.ref-it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin:0 0 7px}
.ref-it.off{opacity:.55}
.ref-it .t{font-weight:600}
.ref-it .m{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ref-it .a{grid-row:1/span 2;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.zone-row{display:grid;grid-template-columns:1fr 120px auto auto;gap:8px;align-items:center;margin:0 0 8px}
@media (max-width:560px){.zone-row{grid-template-columns:1fr 104px;}.zone-row .chk,.zone-row .btn{grid-column:auto}}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}

/* Fenêtre, messages */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,25,.45);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--panel);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:12px 12px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:700px){.modal{align-items:center}.modal-box{border-radius:10px}}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px}
.modal-body{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px calc(10px + var(--safe-b));border-top:1px solid var(--border)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(94vw,520px);pointer-events:none}
#toast div{background:#1f2933;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;display:flex;gap:12px;align-items:center}
#toast div button{all:unset;color:#9dc3e6;font-weight:700;cursor:pointer}
@media (min-width:900px){#toast{bottom:22px}}
.who{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.who-t{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.who-t b{font-size:15.5px}
.who-t span{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.who-t span.late{color:var(--danger)}
</style>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoLocal = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hhmm = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDate = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : s; };
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
const fmtPct = v => v === null || v === undefined ? 'n.d.' : v + ' %';
const clone = o => JSON.parse(JSON.stringify(o));
const daysSince = iso => iso ? Math.floor((new Date(isoLocal()) - new Date(String(iso).slice(0, 10))) / 86400000) : null;
const plural = (n, a, b) => `${n} ${n > 1 ? (b || a + 's') : a}`;

/* ---------- Stockage local ---------- */
let store = null, storageOK = true, persistWarned = false, saveTimer = null;
function defaultStore() {
  return {
    app: 'gemba-terrain', version: APP_VERSION,
    settings: Object.assign({}, DEFAULT_SETTINGS),
    /* grille, thèmes et zones par défaut dans la langue de l'interface */
    themes: clone(DEFAULT_THEMES).map(t => Object.assign(t, { l: T(t.l) })),
    items: DEFAULT_ITEMS.map(i => Object.assign({}, i, { t: T(i.t), r: T(i.r), q: T(i.q), actif: 1 })),
    zones: DEFAULT_ZONES.map((z, n) => Object.assign({ id: 'z' + (n + 1) }, z, { nom: T(z.nom), actif: 1 })),
    annuaire: [],
    visits: []
  };
}
function migrate(s) {
  const d = defaultStore();
  s.settings = Object.assign({}, d.settings, s.settings || {});
  if (!Array.isArray(s.themes) || !s.themes.length) s.themes = d.themes;
  if (!Array.isArray(s.items) || !s.items.length) s.items = d.items;
  if (!Array.isArray(s.zones)) s.zones = d.zones;
  if (!Array.isArray(s.visits)) s.visits = [];
  if (!Array.isArray(s.annuaire)) s.annuaire = [];
  if (s.settings.visiteur && !s.annuaire.length) {
    const p = { id: uid('u'), matricule: '', nom: s.settings.visiteur, fonction: s.settings.fonction || '', service: '', email: '' };
    s.annuaire.push(p); s.settings.moi = p.id;
  }
  delete s.settings.visiteur; delete s.settings.fonction;
  s.visits.forEach(fixVisit);
  return s;
}
function fixVisit(v) {
  v.obs = v.obs || {}; v.items = v.items || []; v.themes = v.themes || [];
  v.synth = Object.assign({ forts: '', ameliorer: '', echanges: '', retour: false }, v.synth || {});
  v.statut = v.statut || 'en cours';
  return v;
}
function load() {

/* ---------- Photos (IndexedDB, avec repli en mémoire) ---------- */
const Photos = {
  db: undefined, mem: new Map(),
  open() {
    if (this.db !== undefined) return Promise.resolve(this.db);
    return new Promise(res => {
      try {
        const r = indexedDB.open(PHOTO_DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id' });
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => { this.db = null; res(null); };
      } catch (e) { this.db = null; res(null); }
    });
  },
  async put(id, data) {
    this.mem.set(id, data);
    const db = await this.open(); if (!db) return false;
    return new Promise(res => {
      try { const tx = db.transaction('p', 'readwrite'); tx.objectStore('p').put({ id, data }); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
      catch (e) { res(false); }
    });
  },
  async get(id) {
    if (this.mem.has(id)) return this.mem.get(id);
    const db = await this.open(); if (!db) return null;
    return new Promise(res => {
      try {
        const r = db.transaction('p').objectStore('p').get(id);
        r.onsuccess = () => { const d = r.result ? r.result.data : null; if (d) this.mem.set(id, d); res(d); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async del(id) {
    this.mem.delete(id);
    const db = await this.open(); if (!db) return;
    try { db.transaction('p', 'readwrite').objectStore('p').delete(id); } catch (e) { /* rien */ }
  },
  async count() {
    const db = await this.open(); if (!db) return this.mem.size;
    return new Promise(res => { try { const r = db.transaction('p').objectStore('p').count(); r.onsuccess = () => res(r.result); r.onerror = () => res(0); } catch (e) { res(0); } });
  },
  async clear() {
    this.mem.clear(); const db = await this.open(); if (!db) return;
    try { db.transaction('p', 'readwrite').objectStore('p').clear(); } catch (e) { /* rien */ }
  }
};
/* Réduit la photo (bord long limité) et la convertit en JPEG. */
function shrinkImage(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ data: c.toDataURL('image/jpeg', 0.72), w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Format d'image non lu")); };
    img.src = url;
  });
}
function hydratePhotos(root) {
  $$('img[data-photo]', root).forEach(async im => {
    if (im.src) return;
    const d = await Photos.get(im.dataset.photo);
    if (d) im.src = d; else { im.alt = 'Photo absente sur cet appareil'; im.closest('.ph') && im.closest('.ph').classList.add('missing'); }
  });
}

const cleanMat = m => String(m || '').trim().toUpperCase().replace(/\s+/g, '');

/* Accompagnant saisi en texte libre : « Nom (matricule) », un matricule seul ou un nom. */
function resolvePerson(txt) {
  const t = String(txt || '').trim(); if (!t) return { nom: '', matricule: '' };
  const m = t.match(/^(.*)\(([^()]+)\)\s*$/);
  const byMat = personByMat(m ? m[2] : t);

  const byName = store.annuaire.find(p => norm(p.nom) === norm(m ? m[1] : t));
  if (byName) return { nom: byName.nom, matricule: byName.matricule };
  return m ? { nom: m[1].trim(), matricule: cleanMat(m[2]) } : { nom: t, matricule: '' };
}
function initials(name) {
  return norm(name).split(/[\s'-]+/).filter(Boolean).slice(0, 3).map(w => w[0].toUpperCase()).join('');
}
function nextNumero(dateIso, mat, nom) {
  const s = store.settings, y = String(dateIso || isoLocal()).slice(0, 4), p = me();
  if (mat === undefined && p) { mat = p.matricule; nom = p.nom; }
  const ref = cleanMat(mat).replace(/[^A-Z0-9]/g, '') || initials(nom || '');
  const base = [s.prefixe || 'GB', y, ref].filter(Boolean).join('-') + '-';
  let max = 0;
  store.visits.forEach(v => { if (v.numero && v.numero.startsWith(base)) { const n = parseInt(v.numero.slice(base.length), 10); if (n > max) max = n; } });
  return base + String(max + 1).padStart(3, '0');
}
function createVisit(d) {

/* Recalcule la grille d'une visite après un changement de type, de mode ou de thèmes,
   en gardant les points déjà évalués et les observations hors grille. */
function rebuildItems(v) {
  const fresh = refItemsFor(v.type, v.mode, v.themes), ids = new Set(fresh.map(i => i.id));
  const kept = v.items.filter(i => !ids.has(i.id) && (i.th === THEME_LIBRE.k || v.obs[i.id]));
  const ord = themeOrder();
  const all = fresh.map(i => v.items.find(x => x.id === i.id) || i).concat(kept);
  v.items = all.map((i, n) => ({ i, n })).sort((a, b) => (ord.indexOf(a.i.th) - ord.indexOf(b.i.th)) || (a.n - b.n)).map(x => x.i);
  touch(v);

const getVisit = id => store.visits.find(v => v.id === id);
function stats(v) {
  const s = { total: v.items.length, done: 0, C: 0, BP: 0, AM: 0, E: 0, NA: 0, Es: 0, byTh: new Map() };
  for (const it of v.items) {
    const o = v.obs[it.id], r = o && o.r;
    let t = s.byTh.get(it.th);
    if (!t) { t = { th: it.th, l: themeLabel(it.th, it.thl), total: 0, done: 0, C: 0, BP: 0, AM: 0, E: 0, NA: 0 }; s.byTh.set(it.th, t); }
    t.total++;
    if (r) { s.done++; s[r]++; t.done++; t[r]++; if (r === 'E' && it.s) s.Es++; }
  }
  s.eval = s.C + s.BP + s.AM + s.E; s.taux = pct(s.C + s.BP, s.eval);
  for (const t of s.byTh.values()) { t.eval = t.C + t.BP + t.AM + t.E; t.taux = pct(t.C + t.BP, t.eval); }
  return s;
}
const isCFSI = it => it.th === 'CF';
function findings(v, r) { return v.items.filter(it => v.obs[it.id] && v.obs[it.id].r === r).map(it => ({ it, o: v.obs[it.id] })); }
/* Vérification avant clôture : rien de bloquant, des rappels ciblés. */
function checks(v) {
  const out = [];
  for (const it of v.items) {
    const o = v.obs[it.id];
    if (it.th === THEME_LIBRE.k && !String(it.t || '').trim()) out.push({ lvl: 'warn', id: it.id, txt: `${it.id} : observation hors grille sans intitulé` });
    if (!o || !o.r) continue;
    if ((o.r === 'E' || o.r === 'AM') && !String(o.c || '').trim()) out.push({ lvl: 'warn', id: it.id, txt: `${it.id} : ${RLAB[o.r].toLowerCase()} sans description de ce qui a été vu` });
    if (o.r === 'E' && !o.suite) out.push({ lvl: 'warn', id: it.id, txt: `${it.id} : écart sans suite définie` });
    if (o.r === 'E' && it.s && !String(o.ai || '').trim() && o.suite !== 'place') out.push({ lvl: 'warn', id: it.id, txt: `${it.id} : écart lié à la sûreté sans action immédiate notée` });
    if (o.r === 'E' && SUITES_FABASOFT.includes(o.suite) && !String(o.fab || '').trim()) out.push({ lvl: 'info', id: it.id, txt: `${it.id} : référence Fabasoft à reporter une fois la fiche créée` });
  }
  const st = stats(v), left = st.total - st.done;
  if (left) out.push({ lvl: 'info', id: '', txt: `${plural(left, 'point')} de la grille non ${left > 1 ? 'évalués' : 'évalué'} (N/A si non observé)` });
  if (!v.synth.retour) out.push({ lvl: 'info', id: '', txt: "Retour aux équipes non coché dans la synthèse" });
  return out;
}

/* ---------- Grille ---------- */
function progHTML(v) {
  const st = stats(v), p = st.total ? Math.round(100 * st.done / st.total) : 0;
  const f = ui.filter;
  return `<div class="prog-bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    <div class="prog-txt"><span><b>${st.done}/${st.total}</b> évalués</span><span>${plural(st.E, 'écart')}, ${st.AM} à améliorer, ${plural(st.BP, 'bonne pratique', 'bonnes pratiques')}</span></div>
    <div class="prog-act"><div class="seg sm">
      <button type="button" data-act="filter" data-k="tout" class="${f === 'tout' ? 'on' : ''}">Tout</button>
      <button type="button" data-act="filter" data-k="reste" class="${f === 'reste' ? 'on' : ''}">À évaluer</button>
      <button type="button" data-act="filter" data-k="constats" class="${f === 'constats' ? 'on' : ''}">Constats</button></div>
      <button type="button" class="btn primary sm" data-act="next" ${st.done < st.total ? '' : 'disabled'}>Suivant</button></div>`;
}
function visibleIn(v, it) {
  const r = v.obs[it.id] && v.obs[it.id].r;
  if (ui.filter === 'reste') return !r;
  if (ui.filter === 'constats') return ['BP', 'AM', 'E'].includes(r) || it.th === THEME_LIBRE.k;
  return true;
}
function renderGrille(v) {
  const groups = new Map();
  v.items.forEach(it => { if (!groups.has(it.th)) groups.set(it.th, []); groups.get(it.th).push(it); });
  const closed = ui.closed[v.id] || (ui.closed[v.id] = new Set());
  let h = `<div class="wrap"><div class="prog" id="prog">${progHTML(v)}</div>`;
  let shown = 0;
  for (const [th, its] of groups) {
    const vis = its.filter(it => visibleIn(v, it));
    if (!vis.length) continue;
    shown += vis.length;
    const done = its.filter(it => v.obs[it.id] && v.obs[it.id].r).length;
    h += `<section class="th ${closed.has(th) ? 'closed' : ''}" data-th="${esc(th)}">
      <button type="button" class="th-head" data-act="th-toggle"><span>${esc(themeLabel(th, its[0].thl))}</span><span class="th-cnt">${done}/${its.length}</span><span class="chev"></span></button>
      <div class="th-body">${vis.map(it => itemCard(v, it)).join('')}</div></section>`;
  }
  if (!shown) h += `<div class="empty">${ui.filter === 'reste' ? 'Tous les points de la grille sont évalués.' : ui.filter === 'constats' ? 'Aucun constat pour l’instant.' : 'La grille est vide : choisir une profondeur dans Infos.'}</div>`;
  h += `<button type="button" class="btn wide" style="margin-top:6px" data-act="add-libre">Ajouter une observation hors grille</button>`;
  h += `<p class="hint" style="margin-top:12px">Repères : ce qu'il faut regarder et la question à poser sur place. Toucher à nouveau une évaluation l'efface.</p></div>`;
  return h;
}
const RB_LABEL = { C: 'Conforme', BP: 'Bonne pratique', AM: 'À amé&shy;liorer', E: 'Écart', NA: 'N/A' };
function itemCard(v, it) {
  const o = v.obs[it.id] || {}, r = o.r || '', libre = it.th === THEME_LIBRE.k;
  const det = libre || ['BP', 'AM', 'E'].includes(r) || ui.notes.has(it.id) || o.c || (o.ph && o.ph.length);
  const hint = ui.hints.has(it.id);
  let h = `<article class="it ${r ? 'r-' + r : ''}" id="it-${esc(it.id)}" data-id="${esc(it.id)}">
    <div class="it-top"><span class="it-id">${esc(it.id)}</span>${it.s ? '<span class="tag sur">Sûreté</span>' : ''}${it.e && v.mode !== 'rapide' && !libre ? '<span class="tag">Essentiel</span>' : ''}<span class="spacer"></span>`;
  if (!libre && (it.r || it.q)) h += `<button type="button" class="lnk" data-act="hint">${hint ? 'Masquer les repères' : 'Repères'}</button>`;
  if (!det) h += `<button type="button" class="lnk" data-act="note" style="margin-left:12px">Note</button>`;
  if (libre) h += `<button type="button" class="lnk" data-act="libre-del" style="margin-left:12px">Retirer</button>`;
  h += '</div>';
  if (libre) h += `<label class="fld"><span>Observation hors grille</span><textarea data-it="t" rows="2" placeholder="Pratique observée, en une phrase">${esc(it.t)}</textarea></label>
      <label class="chk" style="margin:-4px 0 6px"><input type="checkbox" data-it="s" ${it.s ? 'checked' : ''}><span>Liée à la sûreté</span></label>`;
  else h += `<div class="it-txt">${esc(it.t)}</div>`;
  if (hint) h += `<div class="it-hint">${it.r ? `<p><b>Regarder :</b> ${esc(it.r)}</p>` : ''}${it.q ? `<p><b>Demander :</b> « ${esc(it.q)} »</p>` : ''}${it.ref ? `<p class="small">${esc(it.ref)}</p>` : ''}</div>`;
  h += `<div class="rate">${RATINGS.map(x => `<button type="button" class="rb c-${x.k} ${r === x.k ? 'on' : ''}" data-act="rate" data-r="${x.k}" aria-pressed="${r === x.k}" title="${esc(RLAB[x.k])}">${RB_LABEL[x.k]}</button>`).join('')}</div>`;
  if (det) h += detailsHTML(it, o);
  return h + '</article>';
}
function detailsHTML(it, o) {
  const r = o.r || '';
  const lab = { BP: 'Bonne pratique observée', AM: 'Ce qui peut être amélioré', E: 'Constat' }[r] || 'Note';
  const ph = r === 'BP' ? "Ce qui mérite d'être partagé avec les autres équipes" : (r === 'E' || r === 'AM') ? 'Ce qui a été vu : pratique, lieu, pièce ou document. Sans nommer de personne.' : 'Note libre';
  let h = `<div class="it-det"><label class="fld"><span>${lab}</span><textarea data-f="c" rows="2" placeholder="${esc(ph)}">${esc(o.c)}</textarea></label>`;
  if (r === 'E') {
    if (it.s || isCFSI(it)) h += `<div class="alert">${isCFSI(it) ? MSG_CFSI : MSG_SURETE}</div>`;
    h += `<label class="fld"><span>Action immédiate sur place</span><textarea data-f="ai" rows="2" placeholder="Mise en sécurité, isolement, information du responsable...">${esc(o.ai)}</textarea></label>
      <div class="grid2"><label class="fld"><span>Suite à donner</span><select data-f="suite">${SUITES.map(s => `<option value="${s.k}" ${(o.suite || '') === s.k ? 'selected' : ''}>${esc(s.l)}</option>`).join('')}</select></label>
      <label class="fld"><span>Réf. Fabasoft</span><input type="text" data-f="fab" value="${esc(o.fab)}" placeholder="Numéro FNC ou CAPA"></label></div>`;
  }
  if (store.settings.photos) {
    h += `<div class="photos">${(o.ph || []).map(p => `<div class="ph"><img data-photo="${esc(p.id)}" data-act="photo-view" alt="Photo"><button type="button" data-act="photo-del" data-pid="${esc(p.id)}">Retirer</button></div>`).join('')}
      <button type="button" class="btn sm" data-act="photo-add">Ajouter une photo</button></div>`;
  }
  return h + '</div>';
}
function refreshCard(v, id) {
  const it = v.items.find(x => x.id === id), el = document.getElementById('it-' + id);
  if (!it || !el) return;
  el.outerHTML = itemCard(v, it);
  const nel = document.getElementById('it-' + id); hydratePhotos(nel);
  refreshProg(v, it.th);
}
function refreshProg(v, th) {
  const p = $('#prog'); if (p) p.innerHTML = progHTML(v);
  if (th) {
    const sec = $(`.th[data-th="${CSS.escape(th)}"] .th-cnt`);
    if (sec) { const its = v.items.filter(i => i.th === th); sec.textContent = `${its.filter(i => v.obs[i.id] && v.obs[i.id].r).length}/${its.length}`; }
  }
}
function setRating(v, id, r) {
  const it = v.items.find(x => x.id === id); if (!it) return;
  const o = v.obs[id] || (v.obs[id] = {});
  if (o.r === r) { delete o.r; delete o.t; }
  else {
    o.r = r; o.t = new Date().toISOString();
    if (r === 'E' && isCFSI(it) && !o.suite) o.suite = 'cfsi';
  }
  if (!o.r && !o.c && !o.ai && !o.fab && !(o.ph && o.ph.length)) delete v.obs[id];
  touch(v); refreshCard(v, id);
}
function goNext(v) {
  const it = v.items.find(x => !(v.obs[x.id] && v.obs[x.id].r));
  if (!it) { toast('Tous les points sont évalués.'); return; }
  const closed = ui.closed[v.id] || new Set();
  let el = document.getElementById('it-' + it.id);
  if (!el || closed.has(it.th)) { closed.delete(it.th); if (!el && ui.filter === 'constats') ui.filter = 'tout'; rerender(); el = document.getElementById('it-' + it.id); }
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300);
}
function goToItem(v, id) {
  ui.view = 'visite'; ui.visitId = v.id; ui.tab = 'grille'; ui.filter = 'tout';
  const it = v.items.find(x => x.id === id); if (it && ui.closed[v.id]) ui.closed[v.id].delete(it.th);
  render();
  const el = document.getElementById('it-' + id);
  if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); }
}
function addLibre(v) {
  const n = v.items.filter(i => i.th === THEME_LIBRE.k).reduce((m, i) => Math.max(m, parseInt(i.id.slice(2), 10) || 0), 0) + 1;
  const id = 'HG' + pad(n);
  v.items.push({ id, th: THEME_LIBRE.k, thl: THEME_LIBRE.l, t: '', r: '', q: '', s: 0, e: 0, ref: '' });
  touch(v); if (ui.filter === 'reste') ui.filter = 'tout';
  rerender();
  const el = document.getElementById('it-' + id);
  if (el) { el.scrollIntoView({ block: 'center' }); const ta = el.querySelector('textarea'); if (ta) ta.focus(); }
}

/* ---------- Synthèse ---------- */
function kpiTiles(list) { return `<div class="kpis">${list.map(k => `<div class="kpi"><div class="v">${esc(k.v)}</div><div class="l">${esc(k.l)}</div>${k.s ? `<div class="s">${esc(k.s)}</div>` : ''}</div>`).join('')}</div>`; }
function barCell(val, tip) {
  return `<div class="barcell" title="${esc(tip || '')}"><div class="track">${val === null ? '' : `<i style="width:${val}%"></i>`}</div><span class="val">${fmtPct(val)}</span></div>`;
}
function themeTable(rows) {
  if (!rows.length) return '<p class="muted small">Aucun point évalué.</p>';
  return `<div class="thlist">${rows.map(t => {
    const parts = [t.E ? `<b class="e">${plural(t.E, 'écart')}</b>` : '', t.AM ? `<b class="am">${t.AM} à améliorer</b>` : '', t.BP ? plural(t.BP, 'bonne pratique', 'bonnes pratiques') : ''].filter(Boolean);
    return `<div class="thr"><div class="thr-h"><span>${esc(t.l)}</span><span>${plural(t.eval, 'évalué')}</span></div>
      ${barCell(t.taux, `Conformes ${t.C}, bonnes pratiques ${t.BP}, à améliorer ${t.AM}, écarts ${t.E}, N/A ${t.NA}`)}${parts.length ? `<div class="thr-c">${parts.join(', ')}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
function findingList(v, r) {
  const f = findings(v, r);
  if (!f.length) return '<p class="muted small" style="margin:0 0 8px">Aucun.</p>';
  return `<ul class="list">${f.map(({ it, o }) => `<li data-act="goto" data-id="${esc(it.id)}"><div class="t">${esc(it.id)} ${it.s ? '<span class="tag sur">Sûreté</span> ' : ''}${esc(it.t || 'Observation sans intitulé')}</div>
    ${o.c ? `<div class="c">${esc(o.c)}</div>` : ''}${r === 'E' ? `<div class="c">Action immédiate : ${esc(o.ai || 'non renseignée')}. Suite : ${esc(SUITE_LAB[o.suite || ''])}${o.fab ? ', ' + esc(o.fab) : ''}</div>` : ''}</li>`).join('')}</ul>`;
}
function renderSynthese(v) {
  const st = stats(v), ch = checks(v), sy = v.synth;
  let h = `<div class="wrap"><h2>Synthèse</h2><p class="lead">${esc(v.numero)}, ${esc(v.zone)} (${TYPES[v.type].toLowerCase()}), ${fmtDate(v.date)}</p>`;
  h += kpiTiles([
    { v: `${st.done}/${st.total}`, l: 'Points vus', s: st.NA ? `dont ${st.NA} N/A` : '' },
    { v: fmtPct(st.taux), l: 'Pratiques conformes', s: 'bonnes pratiques incluses' },
    { v: st.E, l: 'Écarts', s: st.Es ? `dont ${st.Es} sûreté` : '' }, { v: st.AM, l: 'À améliorer' }, { v: st.BP, l: 'Bonnes pratiques' }
  ]);
  h += `<h3>Par thème</h3>${themeTable([...st.byTh.values()])}`;
  h += `<h3>Écarts</h3>${findingList(v, 'E')}<h3>À améliorer</h3>${findingList(v, 'AM')}<h3>Bonnes pratiques</h3>${findingList(v, 'BP')}`;
  h += `<h3>Conclusion de la visite</h3><div class="box">
    <div class="row" style="justify-content:flex-end;margin:-4px 0 6px"><button type="button" class="btn sm" data-act="syn-propose">Proposer à partir des constats</button></div>
    <label class="fld"><span>Points forts</span><textarea data-syn="forts" rows="3">${esc(sy.forts)}</textarea></label>
    <label class="fld"><span>Points à améliorer</span><textarea data-syn="ameliorer" rows="3">${esc(sy.ameliorer)}</textarea></label>
    <label class="fld"><span>Échanges avec les équipes</span><textarea data-syn="echanges" rows="3" placeholder="Questions posées, réponses marquantes, difficultés remontées, engagements pris sur place">${esc(sy.echanges)}</textarea></label>
    <label class="chk"><input type="checkbox" data-syn="retour" ${sy.retour ? 'checked' : ''}><span>Retour fait aux équipes à la fin de la visite (remerciements, points à corriger, suites prévues)</span></label>
  </div>`;
  h += `<h3>Vérification</h3>`;
  if (!ch.length) h += '<p class="muted small">Rien à signaler.</p>';
  else h += `<ul class="list checks">${ch.map(c => `<li ${c.id ? `data-act="goto" data-id="${esc(c.id)}"` : ''} class="${c.lvl === 'warn' ? '' : 'muted'}" style="${c.lvl === 'warn' ? 'border-left:4px solid var(--warn)' : ''}">${esc(c.txt)}</li>`).join('')}</ul>`;
  h += v.statut === 'terminée'
    ? `<p class="muted small">Visite clôturée le ${fmtDate(v.closed)}.</p><button type="button" class="btn" data-act="v-reopen">Rouvrir la visite</button>`
    : `<button type="button" class="btn primary big" data-act="v-close-send" style="margin-top:6px">Clôturer et envoyer le rapport</button>
       <button type="button" class="btn wide" data-act="v-close" style="margin-top:8px">Clôturer sans envoyer</button>`;
  return h + '</div>';
}
function proposeSynth(v) {
  const bp = findings(v, 'BP'), e = findings(v, 'E'), am = findings(v, 'AM'), st = stats(v);
  const en = LANG === 'en', sep = en ? ': ' : ' : ';
  const line = ({ it, o }) => `- ${T(it.t) || 'Observation'}${o.c ? sep + o.c.replace(/\s+/g, ' ').trim() : ''}`;
  const full = [...st.byTh.values()].filter(t => t.eval >= 2 && t.taux === 100).map(t => t.l);
  const forts = [...bp.map(line), ...(full.length ? [`- ${en ? 'No gap found on: ' : 'Aucun écart relevé sur : '}${full.map(l => T(l)).join(', ').toLowerCase()}`] : [])].join('\n');
  const amel = [...e.map(x => line(x) + (en ? ' (gap)' : ' (écart)')), ...am.map(line)].join('\n');
  return { forts, ameliorer: amel };
}

function loadExamples() {

  const plan = [[118, 'z2', 'complet'], [96, 'z3', 'rapide'], [83, 'z10', 'rapide'], [61, 'z4', 'complet'], [47, 'z9', 'rapide'], [33, 'z2', 'rapide'], [20, 'z5', 'complet'], [9, 'z11', 'rapide']];

function deleteVisits(ids) {

    case 'examples': loadExamples(); ui.view = ui.view === 'pilotage' ? 'pilotage' : 'visites'; render(); toast('Visites d’exemple chargées (numéros EX). Les supprimer avant un usage réel.'); break;
    case 'x-base-xlsx': exportBaseXLSX(); break;
    case 'examples-del': { const ids = store.visits.filter(x => x.exemple).map(x => x.id); if (ids.length) deleteVisits(ids); break; }
    case 'x-base-json': exportBaseJSON(); break;
    case 'x-config': exportConfig(); break;
    case 'flow-guide': flowGuide(); break;
    case 'flow-test': testFlow(); break;
    case 'ann-add': editPerson(null); break;
    case 'ann-edit': editPerson(b.dataset.id); break;
    case 'ann-import': $('#file-ann').value = ''; $('#file-ann').click(); break;
    case 'ann-export': exportAnnuaireXLSX(); break;
    // Référentiel
    case 'ref-add': editItem(null); break;
    case 'ref-edit': editItem(b.dataset.id); break;
    case 'ref-themes': editThemes(); break;
    case 'ref-export': exportRefXLSX(); break;
    case 'ref-import': $('#file-ref').value = ''; $('#file-ref').click(); break;
    case 'ref-reset': confirmBox('Rétablir le référentiel proposé', 'Les points et thèmes modifiés ou ajoutés sur cet appareil seront remplacés par le référentiel d’origine. Les visites déjà faites ne changent pas.', 'Rétablir', () => {
      const prev = { items: store.items, themes: store.themes };
      { const d0 = defaultStore(); store.items = d0.items; store.themes = d0.themes; } persist(true); render();
      toast('Référentiel d’origine rétabli.', () => { store.items = prev.items; store.themes = prev.themes; persist(true); render(); });
    }, true); break;
    // Paramètres
    case 'zone-add': store.zones.push({ id: uid('z'), nom: T('Nouvelle zone'), type: 'A', actif: 1 }); persist(true); render(); { const ins = $$('[data-zf="nom"]'); const last = ins[ins.length - 1]; if (last) { last.focus(); last.select(); } } break;
    case 'zone-del': { const z = store.zones[+b.dataset.n]; if (!z) break; const used = store.visits.some(x => x.zoneId === z.id);
      if (used) { z.actif = 0; toast(`${z.nom} est utilisée par des visites : elle est désactivée plutôt que retirée.`); } else store.zones.splice(+b.dataset.n, 1);
      persist(true); render(); break; }
    case 'wipe': confirmBox('Effacer toutes les données', 'Toutes les visites, photos, zones, paramètres et modifications du référentiel de cet appareil seront supprimés définitivement. Exporter la base en JSON avant si besoin.', 'Tout effacer', async () => {
      try { localStorage.removeItem(STORE_KEY); } catch (er) { /* rien */ }
      await Photos.clear(); store = defaultStore(); ui.sel.clear(); persist(true); applyTheme(); ui.view = 'visites'; render(); toast('Données effacées.');
    }, true); break;
  }
});

/* ---------- Saisie ---------- */
document.addEventListener('input', e => {
  const t = e.target, v = curVisit();
  if (t.dataset.f && v) {
    const id = t.closest('.it').dataset.id, o = v.obs[id] || (v.obs[id] = {});
    o[t.dataset.f] = t.value; touch(v);
    if (t.dataset.f === 'suite' && t.value) refreshProg(v);
    return;
  }
  if (t.dataset.it && v) {
    const it = v.items.find(i => i.id === t.closest('.it').dataset.id); if (!it) return;
    if (t.type === 'checkbox') { it.s = t.checked ? 1 : 0; touch(v); refreshCard(v, it.id); } else { it.t = t.value; touch(v); }
    return;
  }
  if (t.dataset.who && ui.draft) {
    const w = ui.draft.who || (ui.draft.who = {}); w[t.dataset.who] = t.value;
    const p = t.dataset.who === 'matricule' && personByMat(t.value);
    if (p) ['nom', 'fonction', 'email'].forEach(k => { const el = $(`[data-who="${k}"]`); if (el && !el.value) { el.value = p[k] || ''; w[k] = el.value; } });
    return;
  }
  if (t.dataset.vAcc && v) { const r = resolvePerson(t.value); v.accompagnants = r.nom; v.accMatricule = r.matricule; touch(v); return; }
  if (t.dataset.v === 'matricule' && v) { v.matricule = cleanMat(t.value); touch(v); return; }
  if (t.dataset.v && v) {
    if (t.dataset.v === 'zoneId') { const z = store.zones.find(x => x.id === t.value); v.zoneId = t.value; if (z) v.zone = z.nom; touch(v); header(); }
    else { v[t.dataset.v] = t.value; touch(v); if (t.dataset.v === 'date') header(); }
    return;
  }
  if (t.dataset.syn && v) { v.synth[t.dataset.syn] = t.type === 'checkbox' ? t.checked : t.value; touch(v); return; }
  if (t.dataset.d && ui.draft) { ui.draft[t.dataset.d] = t.value; return; }
  if (t.dataset.s) {
    const k = t.dataset.s; store.settings[k] = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? Math.max(1, +t.value || 1) : t.value); persist();
    if (k === 'theme') { if (t.value === 'light' || t.value === 'dark') localStorage.setItem('theme', t.value); applyTheme(); }
    if (k === 'photos') render();
    return;
  }
  if (t.dataset.z !== undefined) {
    const z = store.zones[+t.dataset.z]; if (!z) return;
    const f = t.dataset.zf; z[f] = t.type === 'checkbox' ? (t.checked ? 1 : 0) : t.value; persist(); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target, v = curVisit();
  if (t.dataset.ui) {
    ui[t.dataset.ui] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.type === 'search') return;
    render(); return;
  }
  if (t.dataset.sel) { t.checked ? ui.sel.add(t.dataset.sel) : ui.sel.delete(t.dataset.sel); render(); return; }
  if (t.dataset.dTh !== undefined && ui.draft) { const d = ui.draft; d.themes = t.checked ? [...new Set([...d.themes, t.dataset.dTh])] : d.themes.filter(k => k !== t.dataset.dTh); render(); return; }
  if (t.dataset.vTh !== undefined && v) { v.themes = t.checked ? [...new Set([...v.themes, t.dataset.vTh])] : v.themes.filter(k => k !== t.dataset.vTh); rebuildItems(v); render(); return; }
  if (t.dataset.d === 'zoneId' && ui.draft) { ui.draft.zoneId = t.value; return; }
  if (t.dataset.s === 'prefixe' || t.dataset.s === 'flowUrl') render();
});
/* Recherche en direct sans perdre le focus */
let searchTimer;
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.ui || t.type !== 'search') return;
  ui[t.dataset.ui] = t.value; clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = $(`[data-ui="${t.dataset.ui}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* rien */ } } }, 250);
});

/* ---------- Fichiers ---------- */
$('#file-photo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0], v = curVisit(), id = ui.photoFor;
  if (!f || !v || !id) return;
  try {
    const { data, w, h } = await shrinkImage(f, +store.settings.photoMax || 1280);
    const pid = uid('p'); const saved = await Photos.put(pid, data);
    const o = v.obs[id] || (v.obs[id] = {}); (o.ph || (o.ph = [])).push({ id: pid, w, h });
    touch(v); refreshCard(v, id);
    if (!saved) toast("Photo gardée en mémoire seulement : l'exporter avec la visite avant de fermer.");
  } catch (er) { toast('Photo non ajoutée : ' + er.message); }
});
$('#file-json').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importJSON(f); });
$('#file-ref').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importRef(f); });
$('#file-ann').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importAnnuaire(f); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) writeNow(); });
window.addEventListener('pagehide', () => { if (saveTimer) writeNow(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* ---------- Démarrage ---------- */
load(); applyTheme();
const cur = store.visits.find(v => v.statut !== 'terminée' && v.date === isoLocal());
if (cur) { ui.view = 'visite'; ui.visitId = cur.id; ui.tab = 'grille'; }
render();
if (!storageOK) toast('Stockage local indisponible dans cet affichage : exporter les visites en JSON avant de fermer.');
if (Host.artifact()) setTimeout(() => { hostDownloads(); }, 0);
</script>
</body>
</html>
