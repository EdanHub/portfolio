<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit interne ISO 19443 · Outils qualité</title>
<meta name="description" content="Outil d'audit interne ISO 19443 / ISO 9001 : préparation, plan d'audit, checklist terrain, rédaction des constats, vérification avant émission et rapport Word ou PDF. Hors ligne, données locales.">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="../site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Outils qualité">
<script>
  /* Thème partagé avec le site (clé 'theme'), appliqué avant le rendu pour éviter le flash */
  (function () {
    var t = localStorage.getItem('theme');
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script>
  /* Langue partagée avec le site (clé 'lang', ou ?lang=en dans l'adresse) ; anglais si le navigateur n'est pas en français */
  (function () {
    var q = /[?&]lang=(fr|en)\b/.exec(location.search), s = null;
    try { if (q) localStorage.setItem('lang', q[1]); s = localStorage.getItem('lang'); } catch (e) { /* stockage bloqué */ }
    var l = s === 'fr' || s === 'en' ? s : q ? q[1] : (/^fr\b/i.test(navigator.language || 'fr') ? 'fr' : 'en');
    window.LANG = l;
    document.documentElement.lang = l;
    if (l === 'en') {
      document.documentElement.classList.add('i18n-wait');
      var st = document.createElement('style'); st.textContent = '.i18n-wait body{visibility:hidden}'; document.head.appendChild(st);
    }
  })();
</script>
<!--
  Gestionnaire de rapports d'audit interne (ISO 19443) : préparation, plan d'audit, terrain, constats et rapport.
  Le suivi des constats et des actions reste dans Fabasoft ; l'outil prépare et rédige.
  Fichier autonome : HTML, CSS et JavaScript sans aucune dépendance externe.
  Fonctionne hors ligne, ouverture directe dans Edge, Chrome ou Firefox.

  Architecture du code (section <script>) :
    1. Constantes métier (chapitres, évaluations, référentiel par défaut, questions d'audit, processus)
    2. Utilitaires (dates, texte, similarité, tri des numéros d'exigence)
    3. Stockage (adaptateur LocalStorage, remplaçable par SharePoint/OneDrive) et modèle
    4. Calculs (vérification avant émission, aide à la rédaction)
    5. Vue Audit : dossier, préparation, plan d'audit, terrain, constats, rapport, vérification
    6. Vues transverses : mes audits, référentiel, paramètres
    7. Exports : ZIP, Word (rapport et plan), impression PDF, JSON ; lecture Excel/CSV pour l'import
    8. Exemples, événements et démarrage
-->
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f8f9fa; --border:#d9dde3; --border2:#c3c9d1;
  --text:#1f2933; --muted:#5f6b7a; --accent:#2f4f6b; --accent2:#3f6a8f; --accent-text:#ffffff;
  --hover:#eceff3; --danger:#a23434; --warn:#9a6a12; --ok:#2e6b3a; --bar:#6b8299; --bar2:#a23434;
  --c-c:#6b7f8f; --c-pf:#2e6b3a; --c-pp:#3f6a8f; --c-obs:#9a6a12; --c-ncm:#b45a2a; --c-ncM:#a23434; --c-na:#8a939e; --on:#ffffff;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1e2226; --panel2:#24292e; --border:#343a41; --border2:#454c55;
  --text:#e3e6ea; --muted:#9aa4b0; --accent:#7fa6c6; --accent2:#9dbad3; --accent-text:#11161b;
  --hover:#2a3036; --danger:#e07a7a; --warn:#d9a845; --ok:#7cc08a; --bar:#7d93a8; --bar2:#d46a5e;
  --c-c:#9aaab8; --c-pf:#7cc08a; --c-pp:#8fb3d4; --c-obs:#d9a845; --c-ncm:#e0915e; --c-ncM:#e07a7a; --c-na:#8a939e; --on:#11161b;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 Calibri,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:48px 1fr;grid-template-columns:196px minmax(0,1fr);height:100vh;height:100dvh}
.m-only,.m-inline,.btn.m-only{display:none}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.site-back{color:var(--muted);text-decoration:none;white-space:nowrap;padding:4px 12px 4px 0;border-right:1px solid var(--border);font-size:12.5px}
.site-back:hover{color:var(--accent)}
.site-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{font-weight:400;color:var(--muted);margin-left:6px}
.hdr-current{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);border-left:1px solid var(--border);padding-left:14px}
.hdr-current b{color:var(--text)}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
nav{background:var(--panel);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--text)}
nav button:hover{background:var(--hover)}
nav button.active{background:var(--hover);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav button:disabled{opacity:.4;cursor:default}
nav .nav-foot{margin-top:auto;padding:8px 10px;font-size:11.5px;color:var(--muted);line-height:1.4}
main{position:relative;overflow:hidden;min-width:0}
.view{display:none;height:100%;overflow:auto;padding:20px 24px 40px}
.view.active{display:block}
#view-audit{padding:0}
#view-audit.active{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
.audit-body{overflow:auto;padding:18px 22px 40px;min-height:0}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:14.5px;margin:22px 0 8px}
h4{font-size:13px;margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;max-width:900px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border2);background:var(--panel);border-radius:5px;cursor:pointer;white-space:nowrap;line-height:1.35}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--danger)}
.btn.primary.danger-bg{background:var(--danger);border-color:var(--danger);color:var(--on)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:2px 8px;font-size:12px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;padding:5px 8px;border:1px solid var(--border2);border-radius:5px;background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:54px}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--border2);border-radius:14px;cursor:pointer;background:var(--panel);font-size:12.5px}
.chip:has(input:checked){background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:var(--accent)}
.chip input{margin:0}
.box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.box h3:first-child{margin-top:0}
.hint{font-size:12px;color:var(--muted);margin:2px 0 10px}

/* Barre d'outils de l'audit */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);min-height:44px}
.toolbar select{width:auto;padding:4px 6px}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{all:unset;padding:0 12px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:var(--hover);color:var(--muted)}
.tabs .cnt.err{background:color-mix(in srgb,var(--danger) 18%,var(--panel));color:var(--danger)}
.dropdown{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:270px;padding:4px;z-index:50;display:none}
.menu.open{display:block}
.menu button{all:unset;display:block;width:100%;box-sizing:border-box;padding:7px 10px;border-radius:4px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--muted);font-size:11.5px}
.menu .msep{height:1px;background:var(--border);margin:4px 2px}

/* Tableaux */
table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border)}
table.tbl th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel2);padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--hover)}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td.nowrap{white-space:nowrap}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.filters input[type=search]{max-width:300px}
.filters select{width:auto}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--border2);border-radius:6px}

/* Évaluations et types de constats */
.e-C{--c:var(--c-c)} .e-PF{--c:var(--c-pf)} .e-PP{--c:var(--c-pp)} .e-OBS{--c:var(--c-obs)} .e-NCm{--c:var(--c-ncm)} .e-NCM{--c:var(--c-ncM)} .e-NA{--c:var(--c-na)} .e-{--c:var(--border2)}
.badge{display:inline-block;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:700;border:1px solid var(--c);color:var(--c);white-space:nowrap;line-height:17px}
.badge.fill{background:var(--c);color:var(--on)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;background:var(--hover);color:var(--muted);border:1px solid var(--border);white-space:nowrap;line-height:17px}
.tag.nuc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--border))}
.tag.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden;flex-shrink:0}
.seg button{all:unset;padding:3px 9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);border-right:1px solid var(--border);min-width:22px;text-align:center}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover);color:var(--c)}
.seg button.on{background:var(--c);color:var(--on)}

/* Préparation */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.side{position:sticky;top:0}
.side .btn{white-space:normal;text-align:left;justify-content:flex-start}
.chap{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin:0 0 12px;overflow:hidden}
.chap-head{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--border);font-weight:600}
.chap-head .muted{font-weight:400}
.ref-row{display:grid;grid-template-columns:22px 62px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.ref-row:last-child{border-bottom:0}
.ref-row:hover{background:var(--hover)}
.ref-row input{margin:2px 0 0}
.ref-row .cl{font-weight:700;font-variant-numeric:tabular-nums}
.ref-row .docs{font-size:12px;color:var(--muted)}
.ref-row .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:260px}

/* Terrain */
.sticky-bar{position:sticky;top:-18px;z-index:5;background:var(--bg);padding:10px 0 10px;margin:-6px 0 8px;border-bottom:1px solid var(--border)}
.progress{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter{height:8px;background:var(--hover);border-radius:4px;overflow:hidden;min-width:160px;flex:1;max-width:340px}
.meter span{display:block;height:100%;background:var(--accent)}
.item{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:6px;padding:10px 12px;margin:0 0 10px}
.item.e-C,.item.e-PF,.item.e-PP,.item.e-OBS,.item.e-NCm,.item.e-NCM,.item.e-NA{border-left-color:var(--c)}
.item-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.item-head .cl{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px}
.item-head .tt{flex:1;min-width:220px;font-weight:600}
.item-docs,.item-req{font-size:12px;color:var(--muted);margin:4px 0 0 58px;white-space:pre-wrap}
.item ol.qs{margin:8px 0 8px 58px;padding-left:18px}
.item ol.qs li{margin:2px 0}
.item ol.qs label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.item ol.qs input{margin-top:3px}
.item ol.qs label.done span{color:var(--muted)}
.item .body{margin-left:58px}
.item textarea{min-height:46px}
.item .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.linkish{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.chap-title{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* Constats */
.cgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.clist{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.clist button{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.clist button:last-child{border-bottom:0}
.clist button:hover{background:var(--hover)}
.clist button.active{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.clist .t{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aid{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12.5px}
.aid ul{margin:4px 0 0;padding-left:18px}
.aid li{margin:2px 0}
.aid li.ok{color:var(--ok)}
.aid li.warn{color:var(--warn)}
.aid li.err{color:var(--danger)}
.sim{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}

/* Contrôle */
.score{margin:0 0 10px;max-width:520px}
.score .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.score .meter{max-width:none}
.issue{display:block;width:100%;max-width:760px;text-align:left;border:1px solid var(--border);border-left:4px solid var(--muted);background:var(--panel);padding:6px 10px;border-radius:5px;margin:0 0 6px;cursor:pointer;color:var(--text)}
.issue:hover{background:var(--hover)}
.issue.err{border-left-color:var(--danger)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--ok);cursor:default}

/* Indicateurs et cartes */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 4px}
.card p.sub{margin:0 0 10px;color:var(--muted);font-size:12px}
.bars .br{display:grid;grid-template-columns:minmax(110px,44%) 1fr 34px;gap:8px;align-items:center;margin:4px 0;font-size:12.5px}
.bars .br .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:10px;background:var(--hover);border-radius:3px;overflow:hidden;display:flex}
.bars .track span{display:block;height:100%}
.bars .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Planning et couverture */
.plan{display:grid;grid-template-columns:minmax(160px,240px) repeat(12,minmax(26px,1fr));font-size:12px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--panel)}
.plan>div{padding:4px 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-height:26px}
.plan .h{background:var(--panel2);color:var(--muted);font-weight:600;text-align:center}
.plan .h:first-child{text-align:left}
.plan .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.plan .lab:hover{text-decoration:underline}
.plan .on{background:color-mix(in srgb,var(--bar) 55%,var(--panel))}
.plan .on.done{background:color-mix(in srgb,var(--ok) 55%,var(--panel))}
.plan .on.cancel{background:repeating-linear-gradient(45deg,var(--hover),var(--hover) 4px,var(--panel) 4px,var(--panel) 8px)}
table.mx td.cell{text-align:center;white-space:nowrap}
.mxv{display:inline-block;min-width:30px;padding:0 6px;border-radius:4px;font-weight:700;font-size:12px;background:var(--c);color:var(--on)}
.mxp{display:inline-block;min-width:30px;padding:0 6px;border-radius:4px;font-size:11.5px;color:var(--muted);border:1px dashed var(--border2)}
tr.uncov td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
.prio{display:grid;grid-template-columns:22px 60px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.prio:last-child{border-bottom:0}
.prio .meter{min-width:0}

/* Modale et notifications */
.modal{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:min(820px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal-box.wide{width:min(1100px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0}
#modal-body{padding:14px 16px;overflow:auto}
#modal-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#modal-foot:empty{display:none}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
#toast div{background:var(--text);color:var(--bg);padding:9px 14px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:420px;font-size:12.5px;display:flex;align-items:center;gap:14px}
#toast div button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;padding:2px 0}
.preview{overflow:auto;max-height:240px;border:1px solid var(--border);border-radius:5px;margin:6px 0 12px}
.preview table{border-collapse:collapse;font-size:11.5px}
.preview td,.preview th{border:1px solid var(--border);padding:3px 6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview th{background:var(--panel2);color:var(--muted)}

const I18N_CODES = 'C|PF|PP|OBS|NCm|NCM|NA';

const pl = (n, one, many) => `${n} ${+n > 1 ? many : one}`;
/* listes de valeurs connues (processus...) : traduites seulement si chaque élément est connu */
const trList = sep => m => { const p = m.split(sep); return p.length > 1 && p.every(x => Object.prototype.hasOwnProperty.call(I18N_EN, x.trim())) ? p.map(x => T(x.trim())).join(sep) : m; };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const isoLocal = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = s => { if (!s) return ''; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s); };
const fmtDateTime = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} à ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const yearOf = s => { const m = String(s || '').match(/^(\d{4})/); return m ? Number(m[1]) : null; };
const addDays = (iso, n) => { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; const d = new Date(+m[1], +m[2] - 1, +m[3] + Number(n || 0)); return isoLocal(d); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const opt = (v, l, cur) => `<option value="${esc(v)}"${String(v) === String(cur ?? '') ? ' selected' : ''}>${esc(l)}</option>`;
const fld = (label, inner, cls = '') => `<label class="fld ${cls}"><span>${esc(label)}</span>${inner}</label>`;
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const truncate = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
const splitList = s => String(s || '').split(/[;\n]+/).map(x => x.trim()).filter(Boolean);
const uniq = a => Array.from(new Set(a));

/* Similarité de Sørensen-Dice sur les bigrammes de lettres (même mesure que l'outil arbre des causes). */
function bigrams(s) { const t = norm(s).replace(/ /g, ''); const m = new Map(); for (let i = 0; i < t.length - 1; i++) { const b = t.slice(i, i + 2); m.set(b, (m.get(b) || 0) + 1); } return m; }
function dice(a, b) {
  const A = bigrams(a), B = bigrams(b); let inter = 0, na = 0, nb = 0;
  A.forEach(v => na += v); B.forEach(v => nb += v);
  A.forEach((v, k) => { if (B.has(k)) inter += Math.min(v, B.get(k)); });
  return na + nb ? 2 * inter / (na + nb) : 0;
}

/* Numéros d'exigence : tri naturel (4.4 avant 4.10) et chapitre. */
function clauseNum(c) { const m = String(c || '').match(/\d+(?:\.\d+)*/); return m ? m[0] : ''; }
function clauseKey(c) { const n = clauseNum(c); return n ? n.split('.').map(Number) : [999]; }
function cmpClause(a, b) {
  const A = clauseKey(a), B = clauseKey(b);
  for (let i = 0; i < Math.max(A.length, B.length); i++) { const x = A[i] ?? -1, y = B[i] ?? -1; if (x !== y) return x - y; }
  return String(a || '').localeCompare(String(b || ''), 'fr');
}
const chapOf = c => { const k = clauseKey(c)[0]; return k === 999 ? '' : String(k); };
const chapLabel = ch => ch ? `${ch}. ${CHAPITRES[ch] || 'Chapitre ' + ch}` : 'Hors référentiel';
const evalLabel = c => (store.settings.libelles || {})[c] || SETTINGS_DEFAUT.libelles[c] || 'Non évalué';
const PLURIELS = LANG === 'en' ? { NCM: ['major nonconformity', 'major nonconformities'], NCm: ['minor nonconformity', 'minor nonconformities'], OBS: ['observation', 'observations'], PP: ['opportunity for improvement', 'opportunities for improvement'], PF: ['strength', 'strengths'], C: ['compliant', 'compliant'], NA: ['not audited', 'not audited'] } : { NCM: ['non-conformité majeure', 'non-conformités majeures'], NCm: ['non-conformité mineure', 'non-conformités mineures'], OBS: ['observation', 'observations'], PP: ['piste de progrès', 'pistes de progrès'], PF: ['point fort', 'points forts'], C: ['conforme', 'conformes'], NA: ['non audité', 'non audités'] };
/* Libellé en minuscules accordé au nombre ; un libellé personnalisé dans Paramètres est repris tel quel. */
function typeLabel(c, n) {
  const l = evalLabel(c);
  if (l === SETTINGS_DEFAUT.libelles[c] && PLURIELS[c]) return PLURIELS[c][n > 1 ? 1 : 0];
  return l.charAt(0).toLowerCase() + l.slice(1);
}

function normAudit(a) {
  const d = {
    id: uid(), numero: '', titre: '', type: TYPES_AUDIT[0], processus: [], perimetre: '', referentiels: '', objectifs: '',
    dateDebut: '', dateFin: '', lieu: '', pilote: '', auditeurs: '', verificateur: '', approbateur: '', diffusion: '',
    audites: [], statut: STATUTS_AUDIT[0], synthese: '', appreciation: '', entrees: '', plan: [], items: [], constats: [],
    indice: 'A', dateEmission: '', options: {}, lastExport: '',
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  a = Object.assign(d, a || {});
  if (STATUTS_ANCIENS[a.statut]) a.statut = STATUTS_ANCIENS[a.statut];
  if (!STATUTS_AUDIT.includes(a.statut)) a.statut = STATUTS_AUDIT[0];
  a.options = Object.assign({ checklist: true, documents: true, questions: false }, a.options || {});
  if (!Array.isArray(a.processus)) a.processus = splitList(a.processus);
  a.audites = (a.audites || []).map(p => Object.assign({ nom: '', fonction: '', ouverture: false, cloture: false }, p));
  a.plan = (a.plan || []).map(p => Object.assign({ id: uid(), jour: '', debut: '', fin: '', sujet: '', exigences: '', interlocuteurs: '', lieu: '' }, p));
  a.items = (a.items || []).map(it => Object.assign({ id: uid(), refId: null, clause: '', titre: '', documents: '', exigence: '', nucleaire: false, questions: [], eval: '', preuves: '' }, it, {
    questions: (it.questions || []).map(q => typeof q === 'string' ? { q, ok: false } : Object.assign({ q: '', ok: false }, q))
  }));
  a.constats = (a.constats || []).map((k, i) => {
    const c = Object.assign({ id: uid(), n: i + 1, type: 'OBS', refId: null, clause: '', processus: '', exigence: '', ecart: '', preuve: '', refFabasoft: '', itemId: null }, k);
    if (!c.refFabasoft && k.refCAPA) c.refFabasoft = k.refCAPA;
    ['responsable', 'echeance', 'refCAPA', 'statut'].forEach(f => delete c[f]);
    return c;
  });
  return a;
}

function migrate(d) {
  const base = { app: 'audit-iso19443', version: APP_VERSION, settings: structuredClone(SETTINGS_DEFAUT), referentiel: defaultReferentiel(), audits: [] };
  if (!d || typeof d !== 'object') return base;
  d.app = 'audit-iso19443'; d.version = APP_VERSION;
  d.settings = Object.assign(structuredClone(SETTINGS_DEFAUT), d.settings || {});
  ['cycle', 'anneeRef', 'delaiReponse'].forEach(f => delete d.settings[f]);
  d.settings.libelles = Object.assign({}, SETTINGS_DEFAUT.libelles, (d.settings && d.settings.libelles) || {});
  if (!Array.isArray(d.settings.processus)) d.settings.processus = splitList(d.settings.processus);
  if (!Array.isArray(d.referentiel) || !d.referentiel.length) d.referentiel = defaultReferentiel();
  d.referentiel = d.referentiel.map(r => Object.assign({ id: uid(), clause: '', titre: '', exigence: '', documents: '', processus: '', nucleaire: false, questions: [], source: '' }, r));
  d.audits = Array.isArray(d.audits) ? d.audits.map(normAudit) : [];
  return d;
}

/* Référence affichée : celle de Fabasoft une fois le constat saisi, sinon un numéro provisoire. */

function refsForItem(it) { const r = it.refId && refById(it.refId); return r ? [r] : refsForClause(it.clause); }

function newAudit() {

function itemFromRef(r) {

}
function itemHasData(it) { return !!(it.eval || it.preuves || it.questions.some(q => q.ok)); }
function nextConstatN(a) { return a.constats.reduce((m, k) => Math.max(m, k.n || 0), 0) + 1; }
function stats(a) {
  const total = a.items.length, done = a.items.filter(i => i.eval).length;
  const byEval = {}; a.items.forEach(i => { if (i.eval) byEval[i.eval] = (byEval[i.eval] || 0) + 1; });

  return { total, done, pct: total ? Math.round(100 * done / total) : 0, byEval, byType, nc };
}
/* Documents internes rattachés aux exigences de la checklist, sans doublon : à consulter avant l'audit. */
function auditDocuments(a) {
  const out = new Map();
  sortedItems(a).forEach(it => splitList(String(it.documents || '').replace(/,/g, ';')).forEach(d => { const k = d.toUpperCase(); if (!out.has(k)) out.set(k, { doc: d, clauses: [] }); out.get(k).clauses.push(it.clause); }));
  return [...out.values()];
}

/* =====================================================================
   4. CALCULS : VÉRIFICATION DU RAPPORT, AIDE À LA RÉDACTION
   ===================================================================== */
/* Points à traiter avant d'émettre le rapport : préparation, terrain, rédaction. */
function checkAudit(a) {
  const issues = [], add = (level, text, goto) => issues.push(Object.assign({ level, text }, goto || {}));
  const prep = [
    [!!a.numero && !/-$/.test(a.numero), 'Référence Fabasoft de l’audit incomplète', 'dossier'],
    [!!a.titre, 'Titre de l’audit non renseigné', 'dossier'],
    [!!a.dateDebut, 'Date de l’audit non renseignée', 'dossier'],
    [!!a.pilote, 'Auditeur responsable non renseigné', 'dossier'],
    [a.processus.length > 0 || !!a.perimetre, 'Processus ou périmètre non renseigné', 'dossier'],
    [!!a.objectifs, 'Objectifs non renseignés', 'dossier'],
    [a.items.length > 0, 'Aucune exigence dans la checklist', 'preparation'],
    [a.plan.length > 0, "Plan d'audit non établi", 'plan']
  ];
  prep.forEach(([ok, t, tab]) => { if (!ok) add('warn', t, { tab }); });
  if (a.dateDebut && a.dateFin && a.dateFin < a.dateDebut) add('err', 'La date de fin précède la date de début', { tab: 'dossier' });
  const redige = ['Rapport en rédaction', 'Rapport émis'].includes(a.statut);
  if (!a.audites.some(p => p.nom)) add(redige ? 'err' : 'warn', 'Aucune personne rencontrée renseignée', { tab: 'dossier' });
  const st = stats(a), nonEval = a.items.filter(i => !i.eval);
  if (nonEval.length) add(redige ? 'err' : 'warn', `${plural(nonEval.length, 'exigence')} de la checklist non évaluée${nonEval.length > 1 ? 's' : ''}`, { tab: 'terrain', item: nonEval[0].id });
  a.items.filter(i => isEcart(i.eval) && !a.constats.some(k => k.itemId === i.id || (k.clause && clauseNum(k.clause) === clauseNum(i.clause)))).forEach(i =>
    add('err', `§${i.clause} évaluée ${i.eval} sans constat rédigé`, { tab: 'terrain', item: i.id }));
  a.items.filter(i => i.eval && i.eval !== 'NA' && !i.preuves.trim()).slice(0, 5).forEach(i => add('warn', `§${i.clause} évaluée sans preuve notée`, { tab: 'terrain', item: i.id }));
  let fieldsOk = 0, fieldsTot = 0;
  const names = { exigence: "l'exigence de référence", ecart: "l'écart constaté", preuve: 'les preuves' };
  a.constats.forEach(k => {
    const num = constatNum(a, k), need = isNC(k.type) ? ['exigence', 'ecart', 'preuve'] : ['ecart', 'preuve'];
    need.forEach(f => { fieldsTot++; if (String(k[f] || '').trim()) fieldsOk++; else add(isNC(k.type) ? 'err' : 'warn', `${num} (${k.type}) : renseigner ${names[f]}`, { tab: 'constats', constat: k.id }); });
    if (!k.clause) add('warn', `${num} : exigence du référentiel non indiquée`, { tab: 'constats', constat: k.id });
    redaction(k).filter(x => x.level !== 'ok').forEach(x => add('warn', `${num} : ${x.text}`, { tab: 'constats', constat: k.id }));
  });
  const sansRef = a.constats.filter(k => isEcart(k.type) && !k.refFabasoft);
  if (sansRef.length && a.statut === 'Rapport émis') add('warn', `${plural(sansRef.length, 'constat')} sans référence Fabasoft`, { tab: 'constats', constat: sansRef[0].id });
  if (redige && !a.synthese.trim()) add('warn', 'Synthèse du rapport non rédigée', { tab: 'rapport' });
  if (a.statut === 'Rapport émis' && !a.dateEmission) add('warn', "Date d'émission du rapport non renseignée", { tab: 'rapport' });
  const scores = {
    preparation: Math.round(100 * prep.filter(p => p[0]).length / prep.length),
    execution: a.items.length ? st.pct : 0,
    constats: fieldsTot ? Math.round(100 * fieldsOk / fieldsTot) : 100
  };
  const order = { err: 0, warn: 1, info: 2 };
  issues.sort((x, y) => order[x.level] - order[y.level]);
  return { scores, issues, errors: issues.filter(i => i.level === 'err').length };
}

/* Aide à la rédaction d'un constat : un constat factuel, quantifié, sans solution imposée. */
function redaction(k) {
  const out = [], t = ' ' + norm(k.ecart) + ' ';
  if (!k.ecart.trim()) return out;
  if (k.ecart.trim().length < 30) out.push({ level: 'warn', text: "constat trop court pour être compris sans l'auditeur" });
  const vagues = MOTS_VAGUES.filter(w => t.includes(' ' + norm(w) + ' '));
  if (vagues.length) out.push({ level: 'warn', text: `formulation imprécise (« ${vagues.slice(0, 3).join(' », « ')} ») : indiquer le nombre de cas sur l'échantillon examiné` });
  const sol = MOTS_SOLUTION.filter(w => t.includes(' ' + norm(w)));
  if (sol.length && isEcart(k.type)) out.push({ level: 'warn', text: "le constat propose une solution : décrire l'écart et laisser le processus définir ses actions" });
  if (!/\d/.test(k.ecart) && isNC(k.type)) out.push({ level: 'warn', text: 'aucune référence ni quantité citée (document, indice, nombre de cas)' });
  if (!out.length) out.push({ level: 'ok', text: 'formulation factuelle' });
  return out;
}

function toast(msg, ms = 4200, action) {
  const box = $('#toast');
  $$('div', box).forEach(x => { if (x.dataset.msg === msg) x.remove(); });
  while (box.children.length >= 3) box.firstChild.remove();
  const d = document.createElement('div'); d.dataset.msg = msg;
  const t = document.createElement('span'); t.textContent = msg; d.appendChild(t);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { d.remove(); action.fn(); }); d.appendChild(b); }
  box.appendChild(d);
  setTimeout(() => d.remove(), ms);
}

  const groups = {}; refs.forEach(r => (groups[chapOf(r.clause)] = groups[chapOf(r.clause)] || []).push(r));

  Object.keys(groups).sort((x, y) => (Number(x) || 999) - (Number(y) || 999)).forEach(ch => {

  h += `</div><div class="side prep-side">
    <div class="box"><h3>Checklist</h3>

      <div style="display:flex;flex-direction:column;gap:6px">

/* ---------- Plan d'audit ---------- */
const toMin = t => { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
const toHHMM = n => `${pad(Math.floor(n / 60) % 24)}:${pad(n % 60)}`;
/* Proposition : ouverture, une séquence par processus (ou par chapitre), synthèse des auditeurs, clôture.
   Les durées découlent du nombre d'exigences ; une pause déjeuner est insérée après 12 h. */
function proposePlan(a) {
  const per = Number(store.settings.minutesParExigence) || 15;
  let t = toMin(store.settings.heureDebut) ?? 510;
  const rows = [], who = a.audites.filter(p => p.nom).map(p => p.nom).join(', ');
  const push = (sujet, dur, extra = {}) => {
    if (t < 720 && t + dur > 735 && dur >= 30) { rows.push({ id: uid(), debut: toHHMM(Math.max(t, 720)), fin: toHHMM(Math.max(t, 720) + 60), sujet: T('Pause déjeuner'), exigences: '', interlocuteurs: '', lieu: '' }); t = Math.max(t, 720) + 60; }
    rows.push(Object.assign({ id: uid(), debut: toHHMM(t), fin: toHHMM(t + dur), sujet, exigences: '', interlocuteurs: '', lieu: '' }, extra)); t += dur;
  };
  push(T("Réunion d'ouverture : objectifs, périmètre, déroulement"), 15, { interlocuteurs: who });
  const items = sortedItems(a), groups = [], seen = new Map();
  items.forEach(it => {
    const r = it.refId && refById(it.refId);
    const p = (r && refProcs(r).find(x => a.processus.includes(x))) || T(chapLabel(chapOf(it.clause)));
    if (!seen.has(p)) { seen.set(p, { sujet: p, clauses: [] }); groups.push(seen.get(p)); }
    seen.get(p).clauses.push(it.clause);
  });
  groups.forEach(g => push(g.sujet, Math.max(15, Math.ceil(g.clauses.length * per / 15) * 15), { exigences: g.clauses.map(c => '§' + c).join(', ') }));
  push(T('Synthèse des auditeurs'), 30);
  push(T('Réunion de clôture : présentation des constats'), 30, { interlocuteurs: who });
  return rows;
}
function panePlan(a) {
  const rows = a.plan;
  const inp = (i, k, ph = '', type = 'text', w = '') => `<input type="${type}" data-plan="${i}" data-k="${k}" value="${esc(rows[i][k])}" placeholder="${esc(ph)}"${w ? ` style="width:${w}"` : ''}>`;
  let h = `<p class="lead">Déroulé prévu de l'audit, à transmettre à l'audité avant la visite. La proposition automatique part de la checklist et des personnes rencontrées ; tout reste modifiable.</p>
    <div class="row" style="margin-bottom:12px"><button class="btn primary" type="button" data-act="plan-propose">${rows.length ? 'Proposer à nouveau à partir de la checklist' : 'Proposer un plan à partir de la checklist'}</button>
      <button class="btn" type="button" data-act="plan-add">Ajouter une séquence</button><span class="spacer"></span><button class="btn" type="button" data-exp="plan">Plan d'audit Word (.docx)</button></div>`;
  if (!rows.length) return h + `<div class="empty">Aucune séquence. ${a.items.length ? 'Utiliser la proposition automatique ou ajouter une séquence.' : "Préparer d'abord la checklist dans l'onglet Préparation, puis proposer un plan."}</div>`;
  const multi = a.dateFin && a.dateDebut && a.dateFin !== a.dateDebut;
  h += `<table class="tbl resp plan-tbl"><thead><tr>${multi ? '<th style="width:130px">Jour</th>' : ''}<th style="width:86px">Début</th><th style="width:86px">Fin</th><th>Séquence</th><th style="width:150px">Exigences</th><th>Interlocuteurs</th><th style="width:120px">Lieu</th><th style="width:110px"></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr>${multi ? `<td data-l="Jour">${inp(i, 'jour', '', 'date')}</td>` : ''}<td data-l="Début">${inp(i, 'debut', '08:30', 'time')}</td><td data-l="Fin">${inp(i, 'fin', '09:00', 'time')}</td>
      <td data-l="Séquence">${inp(i, 'sujet', 'Thème, activité ou processus')}</td><td data-l="Exigences">${inp(i, 'exigences', 'Ex. §8.4.2')}</td><td data-l="Interlocuteurs">${inp(i, 'interlocuteurs', 'Fonctions ou noms')}</td><td data-l="Lieu">${inp(i, 'lieu', 'Atelier, bureau')}</td>
      <td class="nowrap acts"><button class="btn ghost sm" type="button" data-act="plan-up" data-i="${i}" title="Monter"${i ? '' : ' disabled'}>Monter</button><button class="btn ghost sm danger" type="button" data-act="plan-del" data-i="${i}">Retirer</button></td></tr>`).join('')}
    </tbody></table>`;
  const docs = auditDocuments(a);
  h += `<p class="hint" style="margin-top:10px">Le plan Word reprend aussi les objectifs, le périmètre, les éléments d'entrée${docs.length ? ` et ${plural(docs.length, 'document')} à tenir à disposition` : ''}.</p>`;
  return h;
}

function addRefsToAudit(a, refs) {
  const have = new Set(a.items.map(i => i.refId)); let n = 0;
  refs.forEach(r => { if (!have.has(r.id)) { a.items.push(itemFromRef(r)); have.add(r.id); n++; } });
  return n;
}
function removeItems(a, ids, cb) {
  const withData = a.items.filter(i => ids.includes(i.id) && itemHasData(i));
  const doIt = () => { a.items = a.items.filter(i => !ids.includes(i.id)); a.constats.forEach(k => { if (ids.includes(k.itemId)) k.itemId = null; }); touch(a); cb && cb(); };
  if (withData.length) confirmBox('Retirer des exigences évaluées', `${plural(withData.length, 'exigence')} déjà évaluée${withData.length > 1 ? 's' : ''} ou annotée${withData.length > 1 ? 's' : ''} : les évaluations et preuves seront perdues. Les constats rédigés sont conservés.`, 'Retirer', doIt);
  else doIt();
}

/* ---------- Terrain ---------- */
function paneTerrain(a) {
  const st = stats(a);
  if (!a.items.length) return `<div class="empty">La checklist est vide. <button class="linkish" data-tab="preparation">Préparer l'audit</button></div>`;
  const q = norm(ui.terr.q), fl = ui.terr.filtre;
  const items = sortedItems(a).filter(i => (!q || norm(`${i.clause} ${i.titre} ${i.documents} ${i.preuves} ${i.questions.map(x => x.q).join(' ')}`).includes(q))
    && (!fl || (fl === 'todo' && !i.eval) || (fl === 'ecarts' && isEcart(i.eval)) || (fl === 'plus' && (i.eval === 'PF' || i.eval === 'PP'))));
  let h = `<div class="sticky-bar"><div class="progress"><span class="progress" id="terr-progress" style="flex:1;min-width:0">${terrProgress(a, st)}</span><button class="btn sm" type="button" data-act="next-todo">Suivante à évaluer</button></div></div>
    <div class="filters"><input type="search" data-f="terr.q" placeholder="Rechercher" value="${esc(ui.terr.q)}">
      <select data-f="terr.filtre">${[['', 'Toutes les exigences'], ['todo', 'Non évaluées'], ['ecarts', 'Écarts (OBS, NC)'], ['plus', 'Points forts et pistes de progrès']].map(([v, l]) => opt(v, l, fl)).join('')}</select>
      <span class="spacer"></span><button class="btn sm" type="button" data-exp="checklist">Imprimer la checklist</button></div>`;
  let lastCh = null;
  items.forEach(it => {
    const ch = chapOf(it.clause);
    if (ch !== lastCh) { h += `<div class="chap-title">${esc(chapLabel(ch))}</div>`; lastCh = ch; }
    h += itemCard(a, it);
  });
  if (!items.length) h += `<div class="empty">Aucune exigence ne correspond au filtre.</div>`;
  return h;
}
function terrProgress(a, st) {
  st = st || stats(a);
  return `<b>${st.done} sur ${st.total}</b> <span class="lg-only">évaluées</span> <div class="meter" style="min-width:80px"><span style="width:${st.pct}%"></span></div>

function draftSyntheseEN(a) {
  const st = stats(a), list = sortedConstats(a);
  const procs = a.processus.length ? a.processus.map(p => T(p)).join(', ') : (a.perimetre || 'the defined scope');
  const ref = splitList(a.referentiels)[0] || 'ISO 19443';
  const lbl = (t, n) => { const l = evalLabel(t); return (l === SETTINGS_DEFAUT.libelles[t] || T(l) !== l) && PLURIELS[t] ? PLURIELS[t][n > 1 ? 1 : 0] : l.charAt(0).toLowerCase() + l.slice(1); };
  const parts = [];
  parts.push(`The audit covered ${procs}${a.dateDebut ? (a.dateFin && a.dateFin !== a.dateDebut ? `, from ${fmtDate(a.dateDebut)} to ${fmtDate(a.dateFin)}` : `, on ${fmtDate(a.dateDebut)}`) : ''}. ${st.done} ${st.done > 1 ? 'requirements' : 'requirement'} of ${ref} ${st.done > 1 ? 'were' : 'was'} assessed out of ${st.total} planned.`);
  const counts = CONSTAT_TYPES.filter(t => st.byType[t]).map(t => `${st.byType[t]} ${lbl(t, st.byType[t])}`);
  parts.push(a.constats.length ? `${a.constats.length} ${a.constats.length > 1 ? 'findings were' : 'finding was'} raised: ${counts.join(', ')}.` : 'No finding was raised.');
  const ecarts = list.filter(k => isEcart(k.type) && k.clause);
  if (ecarts.length) parts.push(`${ecarts.length > 1 ? 'The gaps concern' : 'The gap concerns'} ${uniq(ecarts.map(k => '§' + clauseNum(k.clause))).join(', ')}.`);
  const pf = list.filter(k => k.type === 'PF');
  if (pf.length) parts.push(`Strengths noted: ${pf.map(k => k.ecart.trim().replace(/[.\s]+$/, '')).join('; ')}.`);
  return parts.join('\n\n');
}
function draftSynthese(a) {
  if (LANG === 'en') return draftSyntheseEN(a);
  const st = stats(a), list = sortedConstats(a);
  const procs = a.processus.length ? a.processus.join(', ') : (a.perimetre || 'le périmètre défini');
  const ref = splitList(a.referentiels)[0] || 'ISO 19443';
  const parts = [];
  parts.push(`L'audit a porté sur ${procs}${a.dateDebut ? (a.dateFin && a.dateFin !== a.dateDebut ? `, du ${fmtDate(a.dateDebut)} au ${fmtDate(a.dateFin)}` : `, le ${fmtDate(a.dateDebut)}`) : ''}. ${plural(st.done, 'exigence')} du référentiel ${ref} ${st.done > 1 ? 'ont été évaluées' : 'a été évaluée'} sur ${st.total} prévue${st.total > 1 ? 's' : ''}.`);
  const counts = CONSTAT_TYPES.filter(t => st.byType[t]).map(t => `${st.byType[t]} ${typeLabel(t, st.byType[t])}`);
  parts.push(a.constats.length ? `${plural(a.constats.length, 'constat')} ${a.constats.length > 1 ? 'ont été relevés' : 'a été relevé'} : ${counts.join(', ')}.` : 'Aucun constat n’a été relevé.');
  const ecarts = list.filter(k => isEcart(k.type) && k.clause);

  if (pf.length) parts.push(`Points forts relevés : ${pf.map(k => k.ecart.trim().replace(/[.\s]+$/, '')).join(' ; ')}.`);

}

/* ---------- Import du référentiel : choix de la feuille, de la ligne d'en-tête et des colonnes ---------- */
/* Les expressions s'appliquent aux en-têtes normalisés (minuscules, sans accents ni ponctuation). */
const IMPORT_FIELDS = [
  ['clause', "Numéro d'exigence", true, /^(n|no|num|numero|chap|chapitre|clause|article|paragraphe|para|section|ref|reference|iso|iso 19443|iso 9001)$|^n (de )?(l )?exigence|^numero|chapitre|paragraphe|clause|article/],
  ['titre', 'Intitulé', false, /intitul|titre|libelle|theme/],
  ['exigence', "Texte de l'exigence", false, /exigence|requirement|texte|contenu|description|attendu|resume/],
  ['documents', 'Documents internes', false, /document|procedure|reference|preuve|mode operatoire|instruction|formulaire|reponse|disposition|smq/],
  ['processus', 'Processus', false, /process|pilote|service/],
  ['nucleaire', 'Spécifique ISO 19443 (oui/non)', false, /19443|nucl|specifique/],
  ['questions', "Questions d'audit", false, /question/]

function startImport(sheets, source) {
  sheets = sheets.filter(s => s.rows.some(r => r && r.some(c => String(c ?? '').trim())));
  if (!sheets.length) { toast('Aucune donnée trouvée dans ce fichier.'); return; }
  ui.imp = { sheets, source, sheet: 0, header: 1, map: {}, mode: 'merge', fill: true, keepQ: true };
  guessHeader(); renderImport();
}
function guessHeader() {
  const imp = ui.imp, rows = imp.sheets[imp.sheet].rows;
  let best = 0, bestScore = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    const r = rows[i] || [], s = r.filter(c => c && isNaN(Number(c)) && String(c).length < 60).length + IMPORT_FIELDS.reduce((n, f) => n + (r.some(c => f[3].test(norm(c))) ? 2 : 0), 0);
    if (s > bestScore) { best = i; bestScore = s; }
  }
  imp.header = best + 1; guessMap();
}
function guessMap() {
  const imp = ui.imp, head = (imp.sheets[imp.sheet].rows[imp.header - 1] || []).map(c => norm(c)), used = new Set();
  imp.map = {};
  IMPORT_FIELDS.forEach(([k, , , re]) => { const i = head.findIndex((h, j) => h && !used.has(j) && re.test(h)); if (i >= 0) { imp.map[k] = i; used.add(i); } });
  if (imp.map.clause === undefined) {
    const rows = imp.sheets[imp.sheet].rows.slice(imp.header, imp.header + 30), nCol = Math.max(0, ...rows.map(r => (r || []).length));
    for (let j = 0; j < nCol; j++) if (!used.has(j) && rows.filter(r => /^\s*\d{1,2}(\.\d+)+/.test(String((r || [])[j] ?? ''))).length >= rows.length / 3) { imp.map.clause = j; break; }
  }
}
const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function renderImport() {
  const imp = ui.imp, rows = imp.sheets[imp.sheet].rows, nCol = Math.max(1, ...rows.slice(0, 60).map(r => (r || []).length));
  const head = rows[imp.header - 1] || [];
  const colOpts = cur => [opt('', 'Ne pas importer', cur ?? '')].concat(Array.from({ length: nCol }, (_, j) => opt(j, `${colName(j)}${head[j] ? '  ' + truncate(head[j], 40) : ''}`, cur ?? ''))).join('');
  const prev = rows.slice(Math.max(0, imp.header - 2), imp.header + 6);
  const body = `${imp.sheets.length > 1 ? fld('Feuille', `<select id="imp-sheet">${imp.sheets.map((s, i) => opt(i, `${s.name} (${s.rows.length} lignes)`, imp.sheet)).join('')}</select>`) : ''}
    <div class="grid2">${fld("Ligne d'en-tête", `<input type="number" id="imp-header" min="1" max="${rows.length}" value="${imp.header}">`)}<div class="small muted" style="padding-top:22px">Source : ${esc(imp.source)}</div></div>
    <div class="preview"><table><thead><tr><th></th>${Array.from({ length: nCol }, (_, j) => `<th>${colName(j)}</th>`).join('')}</tr></thead><tbody>
    ${prev.map((r, i) => { const n = Math.max(0, imp.header - 2) + i + 1; return `<tr class="${n === imp.header ? 'hdr' : ''}"><th>${n}</th>${Array.from({ length: nCol }, (_, j) => `<td title="${esc((r || [])[j])}">${esc(truncate((r || [])[j], 40))}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div>
    <h4>Correspondance des colonnes</h4>
    <div class="map-grid">${IMPORT_FIELDS.map(([k, l, req]) => `<label for="imp-map-${k}">${esc(l)}${req ? ' (obligatoire)' : ''}</label><select id="imp-map-${k}" data-imp-map="${k}">${colOpts(imp.map[k])}</select>`).join('')}</div>
    <label class="chk fld"><input type="checkbox" id="imp-fill"${imp.fill ? ' checked' : ''}> Recopier vers le bas les numéros d'exigence manquants (cellules fusionnées dans Excel)</label>
    <label class="chk fld"><input type="radio" name="imp-mode" value="merge"${imp.mode === 'merge' ? ' checked' : ''}> Compléter le référentiel actuel : les exigences de même numéro sont mises à jour, les autres sont ajoutées</label>
    <label class="chk fld"><input type="radio" name="imp-mode" value="replace"${imp.mode === 'replace' ? ' checked' : ''}> Remplacer le référentiel par le contenu du fichier</label>
    <label class="chk fld"><input type="checkbox" id="imp-keepq"${imp.keepQ ? ' checked' : ''}> Reprendre les questions d'audit par défaut pour les exigences reconnues</label>`;
  openModal('Importer le référentiel', body, [{ label: 'Annuler', act: closeModal }, { label: 'Importer', cls: 'primary', act: doImport }], true);
  ui.imp = imp;
}
function readImportForm() {
  const imp = ui.imp; if (!imp) return;
  imp.fill = $('#imp-fill').checked; imp.keepQ = $('#imp-keepq').checked;
  imp.mode = ($('input[name="imp-mode"]:checked') || {}).value || 'merge';
  $$('[data-imp-map]').forEach(s => { if (s.value === '') delete imp.map[s.dataset.impMap]; else imp.map[s.dataset.impMap] = Number(s.value); });
}
function doImport() {
  readImportForm();
  const imp = ui.imp, m = imp.map;
  if (m.clause === undefined) { toast("Choisis la colonne du numéro d'exigence."); return; }
  const rows = imp.sheets[imp.sheet].rows.slice(imp.header);
  const get = (r, k) => m[k] === undefined ? '' : String((r || [])[m[k]] ?? '').trim();
  const isYes = s => !!s && !/^(non|no|n|0|false|faux|-|na|n\/a)$/i.test(s.trim());
  const defQ = {}; REF_DEFAUT.forEach(([c]) => defQ[c] = (QUESTIONS_DEFAUT[c] || []).map(q => T(q)));
  const recs = []; let lastClause = '';
  rows.forEach(r => {
    let clause = get(r, 'clause');
    if (!clause && imp.fill) clause = lastClause; else if (clause) lastClause = clause;
    const titre = get(r, 'titre'), exi = get(r, 'exigence'), docs = get(r, 'documents');
    if (!clause || !clauseNum(clause)) return;
    if (!titre && !exi && !docs && !get(r, 'processus')) return;
    recs.push({ clause: clauseNum(clause) === clause.replace(/^§\s*/, '') ? clauseNum(clause) : clause.replace(/^§\s*/, ''), titre, exigence: exi, documents: docs, processus: get(r, 'processus'), nucleaire: isYes(get(r, 'nucleaire')), questions: get(r, 'questions').split(/\n+/).map(x => x.trim()).filter(Boolean) });
  });
  if (!recs.length) { toast("Aucune ligne exploitable : vérifie la ligne d'en-tête et la colonne du numéro d'exigence."); return; }
  const src = 'Import ' + imp.source + ' du ' + fmtDate(isoLocal());
  const joinU = (a, b, sep) => uniq([...splitList(a), ...splitList(b)].map(x => x.trim())).join(sep);
  const joinT = (a, b) => [a, b].filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).join('\n');
  let added = 0, updated = 0;
  if (imp.mode === 'replace') {
    const merged = new Map();
    recs.forEach(x => {
      const key = x.clause;
      if (!merged.has(key)) merged.set(key, Object.assign({ id: 'r' + key.replace(/[^0-9a-z]+/gi, '-'), source: src }, x));
      else { const y = merged.get(key); y.titre = y.titre || x.titre; y.exigence = joinT(y.exigence, x.exigence); y.documents = joinU(y.documents, x.documents, ' ; '); y.processus = joinU(y.processus, x.processus, ' ; '); y.nucleaire = y.nucleaire || x.nucleaire; y.questions = uniq([...y.questions, ...x.questions]); }
    });
    store.referentiel = [...merged.values()].map(r => {
      const def = REF_DEFAUT.find(([c]) => c === clauseNum(r.clause));
      if (!r.titre && def) r.titre = T(def[1]);
      if (!r.questions.length && imp.keepQ) r.questions = (defQ[clauseNum(r.clause)] || []).slice();
      return r;
    });
    added = store.referentiel.length;
  } else {
    const seen = new Set();
    recs.forEach(x => {
      let r = store.referentiel.find(y => y.clause === x.clause) || store.referentiel.find(y => clauseNum(y.clause) === clauseNum(x.clause) && clauseNum(x.clause) === x.clause);
      if (!r) {
        r = { id: uid(), clause: x.clause, titre: x.titre, exigence: x.exigence, documents: x.documents, processus: x.processus, nucleaire: x.nucleaire, questions: x.questions.length ? x.questions : (imp.keepQ ? (defQ[clauseNum(x.clause)] || []).slice() : []), source: src };
        store.referentiel.push(r); seen.add(r.id); added++; return;
      }
      if (!seen.has(r.id)) { seen.add(r.id); updated++; if (x.exigence) r.exigence = ''; if (x.documents) r.documents = ''; if (x.processus) r.processus = ''; }
      r.titre = x.titre || r.titre; r.exigence = joinT(r.exigence, x.exigence); r.documents = joinU(r.documents, x.documents, ' ; ');
      r.processus = joinU(r.processus, x.processus, ' ; '); r.nucleaire = r.nucleaire || x.nucleaire;
      if (x.questions.length) r.questions = uniq([...(imp.keepQ ? r.questions : []), ...x.questions]);
      r.source = src;
    });
  }
  const newProcs = uniq(store.referentiel.flatMap(refProcs)).filter(p => !store.settings.processus.includes(p));
  persist(true); closeModal(); showView('referentiel');
  toast(`${recs.length} ligne${recs.length > 1 ? 's' : ''} lue${recs.length > 1 ? 's' : ''} : ${added} exigence${added > 1 ? 's' : ''} ajoutée${added > 1 ? 's' : ''}${updated ? `, ${updated} mise${updated > 1 ? 's' : ''} à jour` : ''}.`, 6000);
  if (newProcs.length) toast(`Processus trouvés dans le fichier et absents des paramètres : ${newProcs.slice(0, 6).join(', ')}${newProcs.length > 6 ? '…' : ''}. Les ajouter dans Paramètres pour filtrer dessus.`, 9000);
}

   Registre unique : chaque format reçoit l'audit courant.

const Exporters = {
  docx: { label: 'Rapport Word (.docx)', hint: 'Rapport modifiable : page de garde, visas, synthèse, constats', run: a => exportDOCX(a) },
  pdf: { label: 'Rapport PDF', hint: "Ouvre l'impression : choisir Save as PDF", run: a => exportPDF(a) },

  checklist: { label: 'Checklist terrain à imprimer', hint: "Questions, cases d'évaluation et zones de notes", run: a => exportChecklist(a) },

};
/* Un export du rapport Word ou du JSON réussi date l'audit : sert à prévenir avant une suppression. */
function runExport(k, a) {
  if (!a) return;
  let res;
  try { res = Exporters[k].run(a); } catch (e) { console.error(e); toast('Export impossible : ' + e.message); return; }
  Promise.resolve(res).then(ok => { if (ok && ['docx', 'json'].includes(k)) { a.lastExport = new Date().toISOString(); persist(); } });
}

/* Trois façons de remettre un fichier, selon l'endroit où l'outil est ouvert :
   page publiée sur claude.ai (téléchargement confirmé par le lecteur), téléphone ou tablette
   (feuille de partage : Teams, Outlook, OneDrive, Fichiers), ordinateur (téléchargement classique). */
const Host = {
  coarse: matchMedia('(pointer: coarse)').matches,
  artifact: () => !!(window.claude && typeof window.claude.use === 'function'),
  dl: undefined
};
async function hostDownloads() {
  if (Host.dl !== undefined) return Host.dl;
  try { Host.dl = await window.claude.use('downloads'); } catch (e) { Host.dl = null; }
  return Host.dl;
}
async function download(blob, name) {
  if (Host.artifact()) {
    const dl = await hostDownloads();

/* ---------- Lecture de fichiers pour l'import du référentiel ---------- */
async function readZip(buf) {
  const u = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let eocd = -1;
  for (let i = u.length - 22; i >= Math.max(0, u.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("ce fichier n'est pas un classeur Excel (.xlsx)");
  const n = dv.getUint16(eocd + 10, true), entries = new Map(); let p = dv.getUint32(eocd + 16, true);
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    entries.set(dec.decode(u.subarray(p + 46, p + 46 + nlen)), { method, csize, lho });
    p += 46 + nlen + xlen + clen;
  }
  return {
    has: name => entries.has(name),
    async text(name) {
      const e = entries.get(name); if (!e) return null;
      const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true), raw = u.subarray(start, start + e.csize);
      if (e.method === 0) return dec.decode(raw);
      if (e.method !== 8) throw new Error('compression non prise en charge');
      if (typeof DecompressionStream === 'undefined') throw new Error('navigateur trop ancien pour lire un fichier Excel ; utiliser « Coller depuis Excel »');
      const out = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return dec.decode(out);
    }
  };
}
async function readXLSX(buf) {
  const z = await readZip(buf), P = new DOMParser();
  const xml = async name => { const t = await z.text(name); return t ? P.parseFromString(t, 'application/xml') : null; };
  const all = (doc, tag) => doc ? Array.from(doc.getElementsByTagNameNS('*', tag)) : [];
  const wb = await xml('xl/workbook.xml'); if (!wb) throw new Error('classeur Excel introuvable dans le fichier');
  const rels = await xml('xl/_rels/workbook.xml.rels'), relMap = {};
  all(rels, 'Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const ss = all(await xml('xl/sharedStrings.xml'), 'si').map(si => all(si, 't').filter(t => !t.closest || !t.parentNode || t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
  const colIdx = ref => { const m = String(ref).match(/^[A-Z]+/); let n = 0; for (const ch of m ? m[0] : 'A') n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const sheets = [];
  for (const s of all(wb, 'sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = relMap[rid] || ''; if (!target) continue;
    target = target.startsWith('/') ? target.slice(1) : (target.startsWith('xl/') ? target : 'xl/' + target);
    const doc = await xml(target); if (!doc) continue;
    const rows = [];
    all(doc, 'row').forEach((r, idx) => {
      const ri = r.getAttribute('r') ? Number(r.getAttribute('r')) - 1 : idx, arr = [];
      all(r, 'c').forEach((c, k) => {
        const col = c.getAttribute('r') ? colIdx(c.getAttribute('r')) : k, t = c.getAttribute('t');
        let v = '';
        if (t === 'inlineStr') v = all(c, 't').map(x => x.textContent).join('');
        else { const ve = all(c, 'v')[0]; v = ve ? ve.textContent : ''; if (t === 's') v = ss[Number(v)] ?? ''; else if (t === 'b') v = v === '1' ? 'Oui' : 'Non'; }
        arr[col] = v;
      });
      rows[ri] = arr;
    });
    sheets.push({ name: s.getAttribute('name') || 'Feuille', rows: Array.from(rows, r => Array.from(r || [], x => x ?? '')) });
  }
  return sheets;
}
function parseDelimited(text, delim) {
  text = String(text || '').replace(/^﻿/, '');
  if (!delim) { const first = text.split(/\r?\n/)[0] || ''; const cnt = d => first.split(d).length; delim = ['\t', ';', ','].sort((x, y) => cnt(y) - cnt(x))[0]; }
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"' && field === '') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
async function readRefFile(file) {
  const name = file.name || 'fichier';
  try {
    if (/\.(xlsx|xlsm)$/i.test(name)) { startImport(await readXLSX(await file.arrayBuffer()), name); return; }
    if (/\.xls$/i.test(name)) { toast('Ancien format .xls : enregistrer le fichier en .xlsx dans Excel, ou utiliser « Coller depuis Excel ».', 7000); return; }
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) text = new TextDecoder('windows-1252').decode(buf);
    startImport([{ name: name, rows: parseDelimited(text) }], name);
  } catch (e) { console.error(e); toast('Lecture impossible : ' + e.message, 7000); }
}

  const list = store.audits.filter(a => ids.includes(a.id)); if (!list.length) return;
  const nk = list.reduce((s, a) => s + a.constats.length, 0);
  const notExp = list.filter(a => !a.lastExport || a.lastExport < a.updatedAt);
  const one = list.length === 1;

  if (notExp.length) body += `<div class="warnbox">${one ? "Cet audit n'a pas été exporté" : `${plural(notExp.length, 'audit')} n'${notExp.length > 1 ? 'ont' : 'a'} pas été exporté${notExp.length > 1 ? 's' : ''}`} depuis sa dernière modification. Exporter en JSON avant de supprimer si les données doivent être conservées.</div>`;
  const btns = [{ label: 'Annuler', act: closeModal }];
  if (notExp.length) btns.push({ label: 'Exporter en JSON', act: () => { exportAuditsJSON(list).then(ok => { if (ok) { closeModal(); deleteAudits(ids); } }); } });
  btns.push({ label: one ? "Supprimer l'audit" : `Supprimer les ${list.length} audits`, cls: 'primary danger-bg', act: () => {
    closeModal();
    lastDeleted = JSON.parse(JSON.stringify(list));

    if (ids.includes(ui.currentId)) { ui.currentId = null; store.settings.lastId = null; }

    } });
  } });
  openModal(one ? "Supprimer l'audit" : 'Supprimer des audits', body, btns);
}

  'draft-synthese': () => { const a = cur(); const go = () => { a.synthese = draftSynthese(a); touch(a); renderTab(); }; if (a.synthese.trim()) confirmBox('Remplacer la synthèse', 'La synthèse actuelle sera remplacée par le texte proposé.', 'Remplacer', go, false); else go(); },
  'plan-propose': () => {
    const a = cur(); if (!a.items.length) { toast("Préparer d'abord la checklist dans l'onglet Préparation."); return; }
    const go = () => { a.plan = proposePlan(a); touch(a); renderTab(); refreshTabCounts(); };
    if (a.plan.length) confirmBox('Remplacer le plan', "Le plan actuel sera remplacé par une nouvelle proposition établie à partir de la checklist.", 'Remplacer', go, false); else go();
  },
  'plan-add': () => { const a = cur(), last = a.plan[a.plan.length - 1]; a.plan.push({ id: uid(), jour: last ? last.jour : '', debut: last ? last.fin : (store.settings.heureDebut || ''), fin: '', sujet: '', exigences: '', interlocuteurs: '', lieu: '' }); touch(a); renderTab(); refreshTabCounts(); const ins = $$('[data-plan][data-k="sujet"]'); if (ins.length) ins[ins.length - 1].focus(); },
  'plan-del': el => { const a = cur(); a.plan.splice(Number(el.dataset.i), 1); touch(a); renderTab(); refreshTabCounts(); },
  'plan-up': el => { const a = cur(), i = Number(el.dataset.i); if (i > 0) { [a.plan[i - 1], a.plan[i]] = [a.plan[i], a.plan[i - 1]]; touch(a); renderTab(); } },
  'c-copy': () => { const a = cur(), k = a.constats.find(x => x.id === ui.selConstat); if (k) copyText(constatText(a, k), 'Constat'); },
  'c-copy-all': () => { const a = cur(); copyText(sortedConstats(a).map(k => `${constatNum(a, k)}\n${constatText(a, k)}`).join('\n\n'), 'Constats'); },
  'ref-edit': el => editRef(el.dataset.id),
  'ref-add': () => editRef(null),
  'ref-xlsx': () => exportRefXLSX(),
  'ref-import-file': () => { const i = $('#file-ref'); i.value = ''; i.click(); },
  'ref-import-paste': () => pasteImport(),
  'ref-reset': () => confirmBox('Réinitialiser le référentiel', "Le référentiel revient à la structure par défaut (ISO 9001 et ISO 19443) avec les questions d'origine. Les imports et modifications sont perdus ; les audits gardent leurs checklists.", 'Réinitialiser', () => { store.referentiel = defaultReferentiel(); persist(true); rerender(); }),
  'wipe': () => confirmBox('Effacer toute la base', 'Tous les audits, le référentiel et les paramètres de ce navigateur seront effacés. Exporter la base en JSON avant si besoin.', 'Tout effacer', () => { store = migrate(null); ui.currentId = null; persist(true); applyTheme(); updateHeader(); updateFoot(); showView('programme'); })
};
const BASE_ACTIONS = {
  'export-json': () => exportBaseJSON(),
  'import-json': () => { const i = $('#file-json'); i.value = ''; i.click(); },
  'examples': () => loadExamples()
};
function gotoItem(id) {
  ui.tab = 'terrain'; ui.terr.filtre = ''; ui.terr.q = ''; if (ui.view !== 'audit') showView('audit'); else VIEWS.audit();
  const el = $('#item-' + id); if (el) { el.scrollIntoView({ block: 'center' }); el.style.outline = '2px solid var(--accent)'; setTimeout(() => el.style.outline = '', 1600); }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) $$('.menu.open').forEach(m => m.classList.remove('open'));
  const mb = e.target.closest('[data-mbtn]'); if (mb) { const b = modalButtons[Number(mb.dataset.mbtn)]; if (b && b.act) b.act(); return; }
  if (e.target.id === 'modal') { closeModal(); return; }
  const el = e.target.closest('[data-view],[data-tab],[data-act],[data-eval],[data-open],[data-open-constat],[data-sel-constat],[data-goto-constat],[data-goto-item],[data-goto-tab],[data-exp],[data-base]');
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.view) return showView(d.view);
  if (d.tab) return showTab(d.tab);
  if (d.exp) { $$('.menu.open').forEach(m => m.classList.remove('open')); return runExport(d.exp, cur()); }
  if (d.base) { $$('.menu.open').forEach(m => m.classList.remove('open')); return BASE_ACTIONS[d.base] && BASE_ACTIONS[d.base](); }
  if (d.act) return ACTIONS[d.act] && ACTIONS[d.act](el, e);
  if (d.eval) {
    const a = cur(), it = a.items.find(i => i.id === el.closest('[data-item]').dataset.item);
    it.eval = it.eval === d.eval ? '' : d.eval; touch(a); refreshItem(a, it);
    if (isEcart(it.eval) && !a.constats.some(k => k.itemId === it.id)) toast(`Évaluation ${it.eval} : penser à rédiger le constat.`);
    return;
  }
  if (d.open) { if (e.target.closest('input, label, .selcell')) return; return openAudit(d.open, ui.view === 'couverture' || ui.view === 'programme' || ui.view === 'constats' ? 'dossier' : undefined); }
  if (d.openConstat) { const [aid, kid] = d.openConstat.split('|'); openAudit(aid, 'constats'); ui.selConstat = kid; ui.cDetail = true; renderTab(); return; }
  if (d.selConstat) { ui.selConstat = d.selConstat; ui.cDetail = true; renderTab(); $('#audit-body').scrollTop = 0; return; }
  if (d.gotoConstat) { ui.selConstat = d.gotoConstat; ui.cDetail = true; showTab('constats'); return; }
  if (d.gotoItem) return gotoItem(d.gotoItem);
  if (d.gotoTab) return showTab(d.gotoTab);
});

const debouncedRefresh = debounce(() => { refreshTabCounts(); }, 300);
const debouncedFilter = debounce(fn => rerenderKeep(fn), 220);
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.type === 'checkbox' || t.type === 'radio') return;
  const a = cur();
  if (d.a && a) {
    a[d.a] = t.value; touch(a);
    if (d.a === 'numero' || d.a === 'titre') updateHeader();
    if (d.a === 'statut') { $$('[data-a="statut"]').forEach(s => { if (s !== t) s.value = t.value; }); }
    if (ui.tab === 'rapport') debouncedPreview();
    debouncedRefresh(); return;
  }
  if (d.aud !== undefined && a) { a.audites[Number(d.aud)][d.k] = t.value; touch(a); return; }
  if (d.plan !== undefined && a) { a.plan[Number(d.plan)][d.k] = t.value; touch(a); return; }
  if (d.itemF && a) { const it = a.items.find(i => i.id === t.closest('[data-item]').dataset.item); it[d.itemF] = t.value; touch(a); debouncedRefresh(); return; }
  if (d.c && a) {
    const k = a.constats.find(x => x.id === ui.selConstat); if (!k) return;
    if (d.c === 'refId') {
      if (t.value === '__free') return;
      const r = refById(t.value); k.refId = r ? r.id : null; k.clause = r ? r.clause : '';
      if (r && !k.exigence.trim()) k.exigence = exigenceText({ refId: r.id, clause: r.clause, titre: r.titre, documents: r.documents, exigence: r.exigence });
      const it = r && a.items.find(i => i.refId === r.id); if (it) k.itemId = it.id;
      touch(a); renderTab(); return;
    }
    k[d.c] = t.value;
    touch(a);
    if (d.c === 'type') { renderTab(); return; }
    const aid = $('#c-aid'); if (aid) aid.innerHTML = aidHTML(a, k);
    const cl = $('#clist'); if (cl && (d.c === 'ecart' || d.c === 'refFabasoft')) cl.innerHTML = clistHTML(a);
    if (d.c === 'refFabasoft') { const h = $('.ccol-form h3'); if (h) h.textContent = constatNum(a, k); }
    debouncedRefresh(); return;
  }
  if (d.s) {
    const s = store.settings, numeric = ['minutesParExigence'];
    s[d.s] = numeric.includes(d.s) ? (t.value === '' ? '' : Number(t.value)) : t.value;
    if (d.s === 'theme') { if (t.value === 'light' || t.value === 'dark') localStorage.setItem('theme', t.value); applyTheme(); }
    persist(); return;
  }
  if (d.lib) { store.settings.libelles[d.lib] = t.value || SETTINGS_DEFAUT.libelles[d.lib]; persist(); return; }
  if (t.hasAttribute('data-s-procs')) { store.settings.processus = t.value.split('\n').map(x => x.trim()).filter(Boolean); persist(); return; }
  if (d.f) {
    const [ns, key] = d.f.split('.'); ui[ns][key] = t.value;
    const fn = () => (ui.view === 'audit' ? renderTab() : rerender());
    if (t.tagName === 'SELECT') rerenderKeep(fn); else debouncedFilter(fn);
    return;
  }
  if (t.id === 'imp-header' && ui.imp) { const v = Number(t.value); if (v >= 1) { readImportForm(); ui.imp.header = v; guessMap(); renderImport(); const h = $('#imp-header'); h.focus(); } return; }
  if (t.id === 'imp-sheet' && ui.imp) { readImportForm(); ui.imp.sheet = Number(t.value); guessHeader(); renderImport(); return; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset, a = cur();
  if (t.type !== 'checkbox' && t.type !== 'radio') return;
  if (d.selAudit) { if (t.checked) ui.progSel.add(d.selAudit); else ui.progSel.delete(d.selAudit); rerenderKeep(rerender); return; }
  if (t.hasAttribute('data-sel-all')) {
    const boxes = $$('[data-sel-audit]'); boxes.forEach(b => { if (t.checked) ui.progSel.add(b.dataset.selAudit); else ui.progSel.delete(b.dataset.selAudit); });
    rerenderKeep(rerender); return;
  }
  if (d.proc !== undefined && a) { a.processus = t.checked ? uniq([...a.processus, d.proc]) : a.processus.filter(p => p !== d.proc); touch(a); return; }
  if (d.aud !== undefined && a) { a.audites[Number(d.aud)][d.k] = t.checked; touch(a); return; }
  if (d.opt && a) { a.options[d.opt] = t.checked; touch(a); refreshPreview(); return; }
  if (d.q !== undefined && a) { const it = a.items.find(i => i.id === t.closest('[data-item]').dataset.item); it.questions[Number(d.q)].ok = t.checked; t.closest('label').classList.toggle('done', t.checked); touch(a); return; }
  if (d.prepRef && a) {
    const r = refById(d.prepRef);
    if (t.checked) { addRefsToAudit(a, [r]); touch(a); rerenderKeep(renderTab); refreshTabCounts(); }
    else { const it = a.items.find(i => i.refId === r.id); if (it) removeItems(a, [it.id], () => { rerenderKeep(renderTab); refreshTabCounts(); }); if (it && itemHasData(it)) t.checked = true; }
    return;
  }
  if (d.prepChap !== undefined && a) {
    const refs = refsSorted().filter(r => chapOf(r.clause) === d.prepChap && (!ui.prep.q || norm(`${r.clause} ${r.titre} ${r.documents} ${r.processus} ${r.exigence}`).includes(norm(ui.prep.q))));
    if (t.checked) { addRefsToAudit(a, refs); touch(a); rerenderKeep(renderTab); refreshTabCounts(); }
    else { const ids = a.items.filter(i => refs.some(r => r.id === i.refId)).map(i => i.id); removeItems(a, ids, () => { rerenderKeep(renderTab); refreshTabCounts(); }); t.checked = ids.length > 0 && a.items.some(i => ids.includes(i.id)); }
    return;
  }
  if (d.f) { const [ns, key] = d.f.split('.'); ui[ns][key] = t.checked; rerenderKeep(rerender); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden')) closeModal(); $$('.menu.open').forEach(m => m.classList.remove('open')); }
  const t = e.target;
  if (e.key === 'Enter' && t.hasAttribute && t.hasAttribute('data-qadd')) {
    e.preventDefault(); const v = t.value.trim(); if (!v) return;
    const a = cur(), it = a.items.find(i => i.id === t.closest('[data-item]').dataset.item);
    it.questions.push({ q: v, ok: false }); touch(a); refreshItem(a, it);
    const ni = $(`#item-${it.id} [data-qadd]`); if (ni) ni.focus();
  }
});
$('#file-json').addEventListener('change', async e => { const f = e.target.files[0]; if (f) importJSONText(await f.text()); });
$('#file-ref').addEventListener('change', e => { const f = e.target.files[0]; if (f) readRefFile(f); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.settings.theme === 'auto') applyTheme(); });
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); Storage.save(store); });

applyTheme();
updateFoot();
const lastA = store.settings.lastId && store.audits.find(a => a.id === store.settings.lastId);
if (lastA) ui.currentId = lastA.id;
updateHeader();
showView('programme');
</script>
